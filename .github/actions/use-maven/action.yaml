# Maven 3.10 is not used yet. The Central Portal rejects the bundles it builds
# (mavenplugins/central-publishing-maven-plugin#78), and Quarkus' test bootstrap cannot read
# the repository records it writes, so every Quarkus test downloads everything again. All
# vanillabp repositories stay on 3.9 until both are solved.
name: Use Maven 3.9
description: Puts Maven 3.9 on the PATH, from the Actions cache or else from Maven Central.
inputs:
  version:
    description: The Maven version to use.
    default: 3.9.16
runs:
  using: composite
  steps:
    # A run has more than a hundred jobs, and each of them used to ask Maven Central for the
    # same file. Central sometimes answers that with 404 or 429, and one such job turned the
    # whole run red. A version on Central never changes, so a job takes it from the cache.
    #
    # The first job which comes without a cache fills it. In build.yaml that is 'monorepo' and
    # in nightly.yaml it is 'platform'. The matrix jobs wait for that job, so they find the
    # cache and do not all download at once.
    #
    # The key does not start with 'maven-', because that is the restore key of the Maven
    # repository cache in the workflows.
    - uses: actions/cache@v6
      with:
        path: ~/apache-maven-${{ inputs.version }}
        key: apache-maven-${{ inputs.version }}
    # Into a file and not through a pipe into tar: a transfer which breaks halfway has already
    # written to the pipe, so the next attempt of curl would add to a damaged stream.
    #
    # curl doubles its pause from one second on, so nine repeats wait for about eight and a
    # half minutes. A 429 of Central lasts longer than the 30 seconds which five repeats wait.
    # The job limit of the nightly is 30 minutes, and with this and bin/mvn_with_retry.sh a job
    # which keeps being refused stays inside it. Only the transfer is repeated, so this hides
    # no defect of a blueprint.
    - name: Download Maven unless the cache brought it
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        if [ ! -x "$HOME/apache-maven-$VERSION/bin/mvn" ]; then
          curl -fsSL --retry 9 --retry-all-errors --retry-max-time 600 --connect-timeout 20 --max-time 120 \
            -o "$RUNNER_TEMP/apache-maven.tar.gz" \
            "https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/$VERSION/apache-maven-$VERSION-bin.tar.gz"
          tar xzf "$RUNNER_TEMP/apache-maven.tar.gz" -C "$HOME"
        fi
        echo "$HOME/apache-maven-$VERSION/bin" >> "$GITHUB_PATH"
