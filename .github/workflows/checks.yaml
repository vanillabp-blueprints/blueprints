name: Checks
"on":
  push:
    # Only 'main'. Every other branch is built through its pull request, once instead of
    # twice: a push to a branch with an open pull request used to start this workflow a
    # second time, and two full matrices at once starve each other on Maven Central and on
    # GitHub Packages. What that produces looks like defects of random blueprints.
    branches:
      - main
  pull_request:
  workflow_dispatch:
concurrency:
  # One run per branch: a second push supersedes the run of the first.
  group: checks-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  # The branch of vanillabp-blueprints/.github the index is read from.
  INDEX_REF: main
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install --quiet pyyaml
      - name: Download the blueprints index
        run: curl -fsSL -o blueprints.yaml
          "https://raw.githubusercontent.com/vanillabp-blueprints/.github/${INDEX_REF}/blueprints.yaml"
      - name: Compare the monorepo against the index
        run: python bin/check_index_consistency.py blueprints.yaml
      - name: Check the documentation of every blueprint
        run: python bin/check_docs_structure.py blueprints.yaml
      - name: Check the test harness copies against their reference
        run: python bin/sync_harness.py --check
      # Active since the first platform twin exists (2026-08-15). It keeps the two twins of
      # a blueprint saying the same thing: every difference between their Java sources is
      # either the platform, and then it is approved with a reason, or a mistake. The index
      # comes along because a blueprint with a single twin is a failure as well, unless the
      # index declares the missing platform 'not-applicable'.
      - name: Compare the platform twins of every blueprint
        run: python bin/check_twin_diff.py blueprints.yaml
