name: Checks
"on":
  push:
    # Only 'main'. Every other branch is built through its pull request, once instead of
    # twice: a push to a branch with an open pull request used to start this workflow a
    # second time, and two full matrices at once starve each other on Maven Central. What
    # that produces looks like defects of random blueprints.
    branches:
      - main
  pull_request:
  workflow_dispatch:
concurrency:
  # One run per branch: a second push supersedes the run of the first.
  group: checks-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  # The branch of vanillabp-blueprints/.github the index is read from.
  INDEX_REF: main
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - name: Install dependencies
        run: pip install --quiet pyyaml
      - name: Download the blueprints index
        run: curl -fsSL -o blueprints.yaml
          "https://raw.githubusercontent.com/vanillabp-blueprints/.github/${INDEX_REF}/blueprints.yaml"
      - name: Compare the monorepo against the index
        run: python bin/check_index_consistency.py blueprints.yaml
      # An agent picks blueprints by matching its BPMN against 'covers.bpmn'. A blueprint
      # whose error boundary event the index did not name was never picked for one.
      - name: Check that the index names every event the blueprints use
        run: python bin/check_bpmn_covers.py blueprints.yaml
      - name: Check the documentation of every blueprint
        run: python bin/check_docs_structure.py blueprints.yaml
      # A file table is the first thing a reader of a blueprint looks at, and a file which
      # moves leaves it behind without anything noticing (story 683 corrected 22 of them by
      # hand). This reads the paths and asks the file system.
      - name: Check that the file tables name files which exist
        run: python bin/check_table_paths.py
      # A decision number of another repository can change, and a copied blueprint keeps
      # pointing at it. Texts and comments link the wiki page which describes the behaviour.
      # A blueprint repository is a complete application, so the delta table of its README
      # is the only place which says what differs from the base. An agent probe found
      # files missing there and had to diff the repositories by hand.
      - name: Check that the delta tables name every file which differs from the base
        run: python bin/check_delta_tables.py blueprints.yaml
      - name: Check that no decision of another repository is cited by number
        run: python bin/check_foreign_decisions.py
      - name: Check that no link points at a README anchor of spi-for-java
        run: python bin/check_spi_readme_links.py
      - name: Check the test harness copies against their reference
        run: python bin/sync_harness.py --check
      # A blueprint whose BPMS profiles scope identifiers differently describes a switch
      # nobody survives, and leaving the setting out of one profile is enough to do it:
      # the default is the other mode. module-bpms-migration did exactly that until story
      # 704 measured it, and no test saw it, because a test boots ONE profile.
      - name: Check that the BPMS profiles agree on how identifiers are scoped
        run: python bin/check_scoping_modes.py
      # A profile which switches itself on switches off the BPMS profile which is active by
      # default, and a build without -P<bpms> then has no BPMS adapter. CI always names a
      # BPMS, so no build here would see it. module-simulator and module-under-load did it.
      - name: Check that no profile switches off the default BPMS profile
        run: python bin/check_default_profiles.py
      # Every blueprint carries its own copy of the rule which keeps adapters out of a
      # workflow module. An old copy fails nothing, so it is not noticed otherwise.
      - name: Check that every copy of the adapter rule is the same
        run: python bin/check_enforcer_rule.py
      # Active since the first platform twin exists (2026-08-15). It keeps the two twins of
      # a blueprint saying the same thing: every difference between their Java sources is
      # either the platform, and then it is approved with a reason, or a mistake. The index
      # comes along because a blueprint with a single twin is a failure as well, unless the
      # index declares the missing platform 'not-applicable'.
      - name: Compare the platform twins of every blueprint
        run: python bin/check_twin_diff.py blueprints.yaml
