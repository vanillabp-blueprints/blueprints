name: Build
"on":
  push:
    # Only 'main'. Every other branch is built through its pull request, once instead of
    # twice: a push to a branch with an open pull request used to start this workflow a
    # second time, and two full matrices at once starve each other on Maven Central and on
    # GitHub Packages. What that produces looks like defects of random blueprints.
    branches:
      - main
  pull_request:
  workflow_dispatch:
concurrency:
  # One run per branch: a second push supersedes the run of the first instead of queueing
  # behind it. 'head_ref' is the branch of a pull request and 'ref' the branch of a push.
  group: build-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  # The VanillaBP artifacts are 2.0.0-SNAPSHOT and live in GitHub Packages until the
  # release. Reading them needs a token, see .github/workflows/github-packages-settings.xml.
  USER_NAME: "${{ secrets.VANILLABP_USER_NAME }}"
  USER_TOKEN: "${{ secrets.VANILLABP_USER_TOKEN }}"
  # The branch of vanillabp-blueprints/.github the index is read from - it says which
  # BPMS a blueprint is built against.
  INDEX_REF: main
jobs:
  # The list of blueprints is not maintained anywhere: it is the directories that exist.
  # The same rule the split job follows, so the matrix cannot fall behind the repository.
  #
  # Which BPMS a blueprint is built against is not maintained here either: it is the
  # 'bpms' list of its entry in the index. A blueprint which cannot run on an engine
  # therefore says so where it declares everything else, and a reader of the index sees
  # what the CI does.
  discover:
    runs-on: ubuntu-latest
    outputs:
      combinations: "${{ steps.list.outputs.combinations }}"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install --quiet pyyaml
      - name: Download the blueprints index
        run: curl -fsSL -o blueprints.yaml
          "https://raw.githubusercontent.com/vanillabp-blueprints/.github/${INDEX_REF}/blueprints.yaml"
      - id: list
        name: Collect blueprint and BPMS combinations
        run: |
          list=$(python bin/build_matrix.py blueprints.yaml)
          echo "combinations=${list}" >> "$GITHUB_OUTPUT"
          echo "Building: ${list}"

  # What a user gets after the split: the blueprint directory alone, with a plain Maven
  # and without the aggregator, the wrapper or the root POM of this repository. This is
  # the job that has to be green before a blueprint is delivered.
  blueprint:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Without a limit all of them start at once, and about a hundred jobs asking Maven
      # Central for the same artifacts in the same second get answered with 429 and 403. The
      # Maven cache of the runners does not help on the first run of a branch, which is
      # exactly when it hurts. Twenty at a time costs a few minutes of wall clock, and the
      # runners rarely grant more than that anyway.
      max-parallel: 20
      matrix:
        include: "${{ fromJSON(needs.discover.outputs.combinations) }}"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin
          cache: maven
      - name: Start a Camunda 8 cluster
        if: matrix.bpms == 'camunda8'
        # The address is published here rather than in the build step: a Camunda 7 build
        # must not see a configured camunda8 adapter, because VanillaBP then rightly
        # refuses to boot with no such adapter on the classpath.
        run: |
          bin/camunda8_cluster.sh start
          {
            # Two spellings of the same two properties, because the platforms read an
            # environment variable differently: one maps a name without separators onto
            # 'rest-address', the other expects the dash as an underscore. A variable which
            # matches no property is ignored, so both are set for every blueprint.
            echo "VANILLABP_ADAPTERS_CAMUNDA8_RESTADDRESS=http://localhost:8080"
            echo "VANILLABP_ADAPTERS_CAMUNDA8_REST_ADDRESS=http://localhost:8080"
            # Nothing about name clashes: the adapter's own default is 'none', which uses
            # no tenant and therefore boots against a stock cluster with multi-tenancy
            # switched off. Every job gets a cluster of its own, so unprefixed identifiers
            # cannot meet those of another blueprint. Setting a mode here would test a
            # configuration no blueprint documents.
          } >> "$GITHUB_ENV"
      - name: Build and test the blueprint on its own
        working-directory: "${{ matrix.blueprint }}"
        # --update-snapshots because everything VanillaBP is a SNAPSHOT until 2.0.0 is
        # released: the Maven cache of this runner holds yesterday's, and Maven would keep it
        # for the rest of the day. A blueprint would then be built against a framework which
        # no longer exists, which has cost a red build more than once.
        run: mvn -s "$GITHUB_WORKSPACE/.github/workflows/github-packages-settings.xml"
          --batch-mode --no-transfer-progress --update-snapshots
          -P${{ matrix.bpms }} install verify
      - name: The Camunda 8 cluster's log, if something went wrong
        if: failure() && matrix.bpms == 'camunda8'
        run: bin/camunda8_cluster.sh logs
      - name: Stop the Camunda 8 cluster
        if: always() && matrix.bpms == 'camunda8'
        run: bin/camunda8_cluster.sh stop

  # The aggregator adds what a single blueprint does not see: Spotless over the whole
  # repository, and every blueprint compiled and packaged together.
  #
  # It does NOT run the tests. Those belong to the matrix above, which gives each blueprint the
  # infrastructure it needs - a Camunda 8 cluster where the blueprint runs on that engine, and
  # a MongoDB where it stores its aggregates there. Running them here as well would need every
  # blueprint's infrastructure at once and would test a second time what the matrix already
  # tested.
  monorepo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin
          cache: maven
      - name: Build every blueprint through the aggregator
        run: ./mvnw -s "$GITHUB_WORKSPACE/.github/workflows/github-packages-settings.xml"
          --batch-mode --no-transfer-progress --update-snapshots -DskipTests install

  # One name that never changes, so branch protection has something to require and
  # Renovate has something to wait for. The matrix above is generated from the
  # directories, and its job names grow with every blueprint added.
  verified:
    if: always()
    needs: [blueprint, monorepo]
    runs-on: ubuntu-latest
    steps:
      - name: Every build job succeeded
        run: |
          echo "blueprints: ${{ needs.blueprint.result }}"
          echo "monorepo:   ${{ needs.monorepo.result }}"
          [ "${{ needs.blueprint.result }}" = "success" ] \
            && [ "${{ needs.monorepo.result }}" = "success" ]
