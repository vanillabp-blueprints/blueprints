name: Nightly build
# Two runs a day, and the midday one is temporary. Until the 2.0 release several stories a
# day reach the platform. A break found at two in the morning therefore arrives together
# with everything merged since, and the reader has to work out which change it belongs to.
# The midday run cuts that wait from sixteen hours to about four. After the release a day
# carries far fewer changes, and then this run goes and the early one stays alone.
"on":
  schedule:
    # Early enough to be green or red before anybody starts working.
    - cron: "0 2 * * *"
    # Midday UTC, early afternoon in Europe: what went in during the morning gets its
    # answer while there is still a working day left.
    - cron: "0 12 * * *"
  workflow_dispatch:
permissions:
  contents: read
env:
  USER_NAME: "${{ secrets.VANILLABP_USER_NAME }}"
  USER_TOKEN: "${{ secrets.VANILLABP_USER_TOKEN }}"
  # The branch of vanillabp-blueprints/.github the index is read from - it says which
  # BPMS a blueprint is built against, exactly as in build.yaml.
  INDEX_REF: main
jobs:
  # The same discovery as build.yaml, and for the same reason: which BPMS a blueprint is
  # built against belongs into its index entry, not into a workflow file. Listing the
  # directories and pairing each with both engines built a Camunda-8-only blueprint with
  # '-Pcamunda7', where its only Maven profile is the camunda8 one and active by default,
  # so Maven kept that profile, Spring started with the camunda8 one, and the deployment
  # ran into a cluster no Camunda 7 job ever starts.
  discover:
    runs-on: ubuntu-latest
    outputs:
      combinations: "${{ steps.list.outputs.combinations }}"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: pip install --quiet pyyaml
      - name: Download the blueprints index
        run: curl -fsSL -o blueprints.yaml
          "https://raw.githubusercontent.com/vanillabp-blueprints/.github/${INDEX_REF}/blueprints.yaml"
      - id: list
        name: Collect blueprint and BPMS combinations
        run: |
          list=$(python bin/build_matrix.py blueprints.yaml)
          echo "combinations=${list}" >> "$GITHUB_OUTPUT"
          echo "Building: ${list}"

  # Where the platform artifacts come from decides what a night is worth, so that is
  # settled once, before a matrix of sixty jobs starts.
  #
  # There are two ways a red night can mean nothing. Without the credentials GitHub
  # Packages answers 401, every job dies on a POM it could not read, and that reads like
  # sixty broken blueprints. And a runner which still holds yesterday's snapshot would
  # build against a framework which no longer exists, which is the one thing this workflow
  # is here to notice. So this run restores no Maven cache, every Maven call carries
  # --update-snapshots, and the step below writes down which platform build the night got.
  # 'Nightly issue' quotes that into its report, so a reader sees which side moved.
  platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: temurin
      - name: The credentials for the published snapshots have to be there
        run: |
          missing=""
          [ -n "${USER_NAME}" ] || missing="VANILLABP_USER_NAME"
          [ -n "${USER_TOKEN}" ] || missing="${missing:+${missing} and }VANILLABP_USER_TOKEN"
          if [ -n "${missing}" ]; then
            echo "::error::${missing} is empty. Nothing here can then read the published" \
              "platform snapshots, and a run which resolves nothing proves nothing." \
              "Set the repository secrets VANILLABP_USER_NAME and VANILLABP_USER_TOKEN to" \
              "a GitHub user and a token carrying 'read:packages'. The matrix waits for" \
              "this job, so it does not start on credentials which are not there."
            exit 1
          fi
      - name: Which platform build this run resolves
        run: |
          set -o errexit -o nounset -o pipefail
          probe="${RUNNER_TEMP}/platform-probe"
          # The BOM, because every blueprint imports it and it carries the platform
          # versions. Asking for it through the settings file the matrix uses proves the
          # credentials work before sixty jobs rely on them. The adapters are not asked for
          # here: they live in repositories of their own, with versions of their own, and
          # the matrix resolves them itself a minute later, fresh, as it does everything
          # else.
          mvn -s "$GITHUB_WORKSPACE/.github/workflows/github-packages-settings.xml" \
            --batch-mode --no-transfer-progress --update-snapshots \
            -Dmaven.repo.local="${probe}" \
            org.apache.maven.plugins:maven-dependency-plugin:3.9.0:get \
            -Dartifact=io.vanillabp:vanillabp-bom:2.0.0-SNAPSHOT:pom
          # Which remote build a snapshot came from is not in the '-SNAPSHOT' name Maven
          # keeps it under, but the timestamped file it downloaded lies next to it, and
          # Maven's own metadata of that directory says the same thing. Both are read
          # because the first one depends on how the plugin fetched the file.
          directory="${probe}/io/vanillabp/vanillabp-bom/2.0.0-SNAPSHOT"
          build="$(ls "${directory}" \
            | sed -n 's|^vanillabp-bom-\(2\.0\.0-[0-9.]*-[0-9]*\)\.pom$|\1|p' \
            | head -1)"
          if [ -z "${build}" ]; then
            # Every registry of the 'vanillabp' account answers with the metadata of all of
            # them, so these files are copies of each other and the first one will do.
            meta="$(ls "${directory}"/maven-metadata-*.xml 2>/dev/null | head -1 || true)"
            if [ -n "${meta}" ]; then
              stamp="$(sed -n 's|.*<timestamp>\(.*\)</timestamp>.*|\1|p' "${meta}" | head -1)"
              number="$(sed -n 's|.*<buildNumber>\(.*\)</buildNumber>.*|\1|p' "${meta}" \
                | head -1)"
              build="2.0.0-${stamp}-${number}"
            fi
          fi
          {
            echo "The platform build this run resolved:"
            echo
            if [ -n "${build}" ]; then
              echo "- \`io.vanillabp:vanillabp-bom:2.0.0-SNAPSHOT\`, published as \`${build}\`"
            else
              echo "- \`io.vanillabp:vanillabp-bom:2.0.0-SNAPSHOT\` was read, and nothing"
              echo "  Maven left behind names the build it came from"
            fi
            echo "- asked for at $(date -u '+%Y-%m-%d %H:%M UTC'), from GitHub Packages"
          } > platform-snapshot.md
          cat platform-snapshot.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: platform-snapshot
          path: platform-snapshot.md
          # Read by the report of this run and by nobody afterwards.
          retention-days: 7

  # The same build as on a push, but against today's snapshots of spi-for-java,
  # adapter-platform-integration and the adapters rather than whatever was cached. A
  # blueprint breaking here means the framework moved, not the blueprint, and that is
  # exactly what this job is for.
  freshness:
    # 'platform' as well, because it is what says the published snapshots can be read at
    # all. A matrix which starts without that turns every blueprint red for a reason which
    # has nothing to do with blueprints.
    needs: [discover, platform]
    # Spelled out so the name of a job is stable enough to read: 'Nightly issue' looks for
    # the jobs of this matrix by name, and the name GitHub builds from a matrix entry
    # depends on the order of its keys.
    name: freshness (${{ matrix.blueprint }} on ${{ matrix.bpms }})
    runs-on: ubuntu-latest
    # The longest job of a green run takes six minutes and the median two, so anything
    # near this limit is stuck rather than slow. Without it a job would inherit the six
    # hours GitHub gives by default, which is how a nightly ends up still running when
    # somebody starts working.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # Same limit as the build workflow, for the same reason: this run has no cache on
      # purpose, so every job resolves everything, and a hundred of them starting together
      # are answered by Maven Central with 429 and 403. Nothing here is in a hurry at two in
      # the morning.
      max-parallel: 20
      matrix:
        include: "${{ fromJSON(needs.discover.outputs.combinations) }}"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: 25.0.4+101.0.LTS
          distribution: temurin
      # Written before the build, so the upload below has the name whatever the build does.
      # 'Nightly issue' builds the same name out of the job name, so the two have to agree:
      # the blueprint path with its slashes turned into dashes, then the BPMS.
      - name: The name this job uploads its test reports under
        env:
          BLUEPRINT: "${{ matrix.blueprint }}"
          BPMS: "${{ matrix.bpms }}"
        run: echo "REPORTS_NAME=test-reports-${BLUEPRINT//\//-}-${BPMS}" >> "$GITHUB_ENV"
      - name: Start a Camunda 8 cluster
        if: matrix.bpms == 'camunda8'
        # The address is published here rather than in the build step: a Camunda 7 build
        # must not see a configured camunda8 adapter, because VanillaBP then rightly
        # refuses to boot with no such adapter on the classpath.
        run: |
          bin/camunda8_cluster.sh start
          {
            # Two spellings of the same two properties, because the platforms read an
            # environment variable differently: one maps a name without separators onto
            # 'rest-address', the other expects the dash as an underscore. A variable which
            # matches no property is ignored, so both are set for every blueprint.
            echo "VANILLABP_ADAPTERS_CAMUNDA8_RESTADDRESS=http://localhost:8080"
            echo "VANILLABP_ADAPTERS_CAMUNDA8_REST_ADDRESS=http://localhost:8080"
            # Nothing about name clashes: every blueprint configures its own mode,
            # 'use-prefix', in its BPMS profiles. That runs on a cluster from the stock
            # image, which has multi-tenancy switched off and rejects the tenant the
            # adapter default 'by-adapter' would ask for. A VANILLABP_* entry here would
            # override what the blueprint documents, which is the thing being tested.
          } >> "$GITHUB_ENV"
      # 'install' alone, not 'install verify': install already runs every phase verify
      # has, and naming both compiled every module twice
      # Through bin/mvn_with_retry.sh, because this run resolves everything from scratch
      # and Maven Central answers that with 403 or 429 often enough to be the most common
      # red build here. The script repeats only what the log proves to be a transfer: a
      # failed test is reported the first time, as it has to be.
      - name: Build against the current snapshots
        working-directory: "${{ matrix.blueprint }}"
        run: $GITHUB_WORKSPACE/bin/mvn_with_retry.sh
          -s "$GITHUB_WORKSPACE/.github/workflows/github-packages-settings.xml"
          --batch-mode --no-transfer-progress --update-snapshots
          -P${{ matrix.bpms }} install
      # A red night used to leave nothing behind but the log of the job, so the issue it
      # opens could quote no more than the lines Maven marked as an error. An error line
      # says that a test failed. The report says what the test expected and what it got.
      # Thirty days rather than the default seven, because the Camunda 8 adapter once had
      # nine red nights open at the same time and only the newest one still had its
      # reports.
      - name: Upload the test reports of a blueprint which failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          # One artifact name per matrix entry, because two jobs uploading under one name
          # collide. The name is built by the step above: a blueprint is a path, and a
          # slash is not allowed in an artifact name.
          name: "${{ env.REPORTS_NAME }}"
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          retention-days: 30
          # A job which failed while compiling has no reports, and that is not an error.
          if-no-files-found: ignore
      - name: The Camunda 8 cluster's log, if something went wrong
        if: failure() && matrix.bpms == 'camunda8'
        run: bin/camunda8_cluster.sh logs
      - name: Stop the Camunda 8 cluster
        if: always() && matrix.bpms == 'camunda8'
        run: bin/camunda8_cluster.sh stop
