name: Nightly build
"on":
  schedule:
    # Early enough to be green or red before anybody starts working.
    #
    # The minute is a crooked one, and after the four platform repositories which measure the
    # same published snapshot: the Camunda 8 line matrix from 00:23, the Camunda 7 adapter at
    # 00:41, the Process-Engine-API adapter at 00:56 and the election cache at 01:11. GitHub
    # queues a scheduled run instead of starting it, the queue is longest on the hour, and
    # what stands here is the earliest this may start rather than the time it runs at. So a
    # run on the hour waits behind everybody else's hourly jobs for no reason.
    - cron: "7 2 * * *"
  workflow_dispatch:
permissions:
  contents: read
  # reads the VanillaBP snapshots from GitHub Packages, see VBP_SNAPSHOTS_FROM below
  packages: read
env:
  # Where Maven reads the VanillaBP snapshots from, see .github/maven/settings.xml: from
  # GitHub Packages once the vanillabp organization sets the Actions variable
  # VANILLABP_SNAPSHOTS_FROM to 'github-packages', else from the snapshot repository of Maven
  # Central. Reading GitHub Packages needs a token even for public packages. The GITHUB_TOKEN
  # of the run is enough, with 'packages: read' above.
  VBP_SNAPSHOTS_FROM: "${{ vars.VANILLABP_SNAPSHOTS_FROM == 'github-packages' && 'github-packages' || 'central' }}"
  VBP_PACKAGES_READ_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
  # The branch of vanillabp-blueprints/.github the index is read from - it says which
  # BPMS a blueprint is built against, exactly as in build.yaml.
  INDEX_REF: main
jobs:
  # The same discovery as build.yaml, and for the same reason: which BPMS a blueprint is
  # built against belongs into its index entry, not into a workflow file. Listing the
  # directories and pairing each with both engines built a Camunda-8-only blueprint with
  # '-Pcamunda7', where its only Maven profile is the camunda8 one and active by default,
  # so Maven kept that profile, Spring started with the camunda8 one, and the deployment
  # ran into a cluster no Camunda 7 job ever starts.
  discover:
    runs-on: ubuntu-latest
    # Three parts, one per matrix job below, because GitHub starts no more than 256 jobs
    # from one matrix. bin/build_matrix.py says more.
    outputs:
      part1: "${{ steps.list.outputs.part1 }}"
      part2: "${{ steps.list.outputs.part2 }}"
      part3: "${{ steps.list.outputs.part3 }}"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - name: Install dependencies
        run: pip install --quiet pyyaml
      - name: Download the blueprints index
        run: curl -fsSL -o blueprints.yaml
          "https://raw.githubusercontent.com/vanillabp-blueprints/.github/${INDEX_REF}/blueprints.yaml"
      - id: list
        name: Collect blueprint and BPMS combinations
        run: |
          parts=$(python bin/build_matrix.py blueprints.yaml)
          # one JSON list per line, one line per part
          number=0
          while IFS= read -r part; do
            number=$((number + 1))
            echo "part${number}=${part}" >> "$GITHUB_OUTPUT"
            echo "Building in part ${number}: ${part}"
          done <<< "${parts}"

  # Where the platform artifacts come from decides what a night is worth, so that is
  # settled once, before a matrix of sixty jobs starts.
  #
  # A red night can mean nothing: a runner which still holds yesterday's snapshot would
  # build against a framework which no longer exists, which is the one thing this workflow
  # is here to notice. So the matrix deletes every snapshot the Maven cache carries in,
  # every job resolves its snapshots with --update-snapshots, and the step below writes down which
  # platform build the night got.
  # 'Nightly issue' quotes that into its report, so a reader sees which side moved.
  platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: temurin
      - name: Use Maven 3.9
        uses: ./.github/actions/use-maven
      - name: Which platform build this run resolves
        run: |
          set -o errexit -o nounset -o pipefail
          probe="${RUNNER_TEMP}/platform-probe"
          # The BOM, because every blueprint imports it and it carries the platform
          # versions. Asking for it through the settings file the matrix uses proves the
          # snapshot repository of Maven Central answers before sixty jobs rely on it. The
          # adapters are not asked for here: they have versions of their own, and the matrix
          # resolves them itself a minute later, fresh, as it does everything else.
          mvn -s "$GITHUB_WORKSPACE/.github/maven/settings.xml" \
            --batch-mode --no-transfer-progress --update-snapshots \
            -Dmaven.repo.local="${probe}" \
            org.apache.maven.plugins:maven-dependency-plugin:3.9.0:get \
            -Dartifact=io.vanillabp:vanillabp-bom:2.0.0-SNAPSHOT:pom
          # Which remote build a snapshot came from is not in the '-SNAPSHOT' name Maven
          # keeps it under, but the timestamped file it downloaded lies next to it, and
          # Maven's own metadata of that directory says the same thing. Both are read
          # because the first one depends on how the plugin fetched the file.
          directory="${probe}/io/vanillabp/vanillabp-bom/2.0.0-SNAPSHOT"
          build="$(ls "${directory}" \
            | sed -n 's|^vanillabp-bom-\(2\.0\.0-[0-9.]*-[0-9]*\)\.pom$|\1|p' \
            | head -1)"
          if [ -z "${build}" ]; then
            # the platform comes from one snapshot repository, so there is one such file
            meta="$(ls "${directory}"/maven-metadata-*.xml 2>/dev/null | head -1 || true)"
            if [ -n "${meta}" ]; then
              stamp="$(sed -n 's|.*<timestamp>\(.*\)</timestamp>.*|\1|p' "${meta}" | head -1)"
              number="$(sed -n 's|.*<buildNumber>\(.*\)</buildNumber>.*|\1|p' "${meta}" \
                | head -1)"
              build="2.0.0-${stamp}-${number}"
            fi
          fi
          {
            echo "The platform build this run resolved:"
            echo
            if [ -n "${build}" ]; then
              echo "- \`io.vanillabp:vanillabp-bom:2.0.0-SNAPSHOT\`, published as \`${build}\`"
            else
              echo "- \`io.vanillabp:vanillabp-bom:2.0.0-SNAPSHOT\` was read, and nothing"
              echo "  Maven left behind names the build it came from"
            fi
            echo "- asked for at $(date -u '+%Y-%m-%d %H:%M UTC'), from the snapshot repository of Maven Central"
          } > platform-snapshot.md
          cat platform-snapshot.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: platform-snapshot
          path: platform-snapshot.md
          # Read by the report of this run and by nobody afterwards.
          retention-days: 7

  # What the snapshots of today need and the cache of main does not hold, fetched once.
  #
  # The matrix reads the cache the last build on main wrote. An adapter which moved to a new
  # release of its engine since then, as the Operaton adapter did from Operaton 2.2.1 to 2.2.2
  # on the 26th of November 2026, makes each of its jobs ask Maven Central for that release.
  # Eighty jobs, twenty at a time, and Central answered with 429: four blueprints went red that
  # night, and nothing in them was wrong. So this job resolves what every blueprint needs on
  # every engine, and keeps only what the cache of main lacked, in a small cache of this run
  # which every job of the matrix lays over the cache of main. bin/collect_what_the_cache_lacks.sh
  # says more.
  cache:
    needs: [platform]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: 25.0.5+8
          distribution: temurin
      - name: Use Maven 3.9
        uses: ./.github/actions/use-maven
      # The same cache and the same clean-up as the matrix, so that what this job collects is
      # exactly what a job of the matrix would otherwise fetch itself.
      - uses: actions/cache/restore@v6
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('**/pom.xml') }}-${{ github.run_id }}
          restore-keys: |
            maven-${{ hashFiles('**/pom.xml') }}-
            maven-
      - name: Remove the snapshots the cache carried in
        run: |
          repository="${HOME}/.m2/repository"
          if [ -d "${repository}" ]; then
            find "${repository}" -type d -name '*-SNAPSHOT' -prune -exec rm -rf {} +
            find "${repository}" -type f -name '*.lastUpdated' -delete
          fi
      - name: Collect what the cache of main lacks
        run: bin/collect_what_the_cache_lacks.sh "${HOME}/.m2/nightly-delta"
          -s "$GITHUB_WORKSPACE/.github/maven/settings.xml"
          --batch-mode --no-transfer-progress
      # Not 'maven-' at the start: build.yaml and the matrix restore the newest cache whose key
      # starts with that, and this one holds a few files rather than a repository.
      - uses: actions/cache/save@v6
        with:
          path: ~/.m2/nightly-delta
          key: nightly-delta-${{ github.run_id }}

  # The same build as on a push, but against today's snapshots of spi-for-java,
  # adapter-platform-integration and the adapters rather than whatever was cached. A
  # blueprint breaking here means the framework moved, not the blueprint, and that is
  # exactly what this job is for.
  #
  # GitHub starts no more than 256 jobs from one matrix, and with four engines a night has
  # more. Above that limit the matrix job does not start at all. So there are three matrix
  # jobs, one per part of the list, with the same steps (the YAML anchor below). They run one
  # after the other, so no more than twenty jobs run at once, as before. All three name their
  # jobs 'freshness (...)', which is what 'Nightly issue' looks for.
  freshness-1:
    # 'platform' as well, because it is what says the published snapshots can be read at
    # all. A matrix which starts without that turns every blueprint red for a reason which
    # has nothing to do with blueprints.
    #
    # 'cache' too, but a red one does not stop the matrix: without its files the jobs fetch
    # what they lack themselves, as they did before that job existed.
    needs: [discover, platform, cache]
    # Only an index without a single blueprint leaves the first part empty, and a matrix
    # without an entry is an error rather than an empty run.
    if: >-
      !cancelled() && needs.discover.result == 'success' && needs.platform.result == 'success'
      && needs.discover.outputs.part1 != '[]'
    # Spelled out so the name of a job is stable enough to read: 'Nightly issue' looks for
    # the jobs of this matrix by name, and the name GitHub builds from a matrix entry
    # depends on the order of its keys.
    name: freshness (${{ matrix.blueprint }} on ${{ matrix.bpms }})
    runs-on: ubuntu-latest
    # The longest job of a green run takes six minutes and the median two, so anything
    # near this limit is stuck rather than slow. Without it a job would inherit the six
    # hours GitHub gives by default, which is how a nightly ends up still running when
    # somebody starts working.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # Same limit as the build workflow, for the same reason: a hundred jobs starting
      # together are answered by Maven Central with 429 and 403. Nothing here is in a hurry
      # at two in the morning.
      max-parallel: 20
      matrix:
        include: "${{ fromJSON(needs.discover.outputs.part1) }}"
    steps: &freshness-steps
      - uses: actions/checkout@v7
      # Exact, but in the spelling of the runner's tool cache. The runner brings Temurin
      # 25.0.5+8 along, and setup-java compares a version with a build number to the cache
      # entries character by character, so '25.0.5+8.0.LTS' never matched it. Each of the 258
      # jobs then downloaded the JDK from GitHub's release storage, and when that storage
      # answered with 504 for half an hour, 142 jobs went red before Maven started.
      - uses: actions/setup-java@v6
        with:
          java-version: 25.0.5+8
          distribution: temurin
      - name: Use Maven 3.9
        uses: ./.github/actions/use-maven
      # The cache of the last build on main, read-only, as in build.yaml. This run used to
      # start without any cache, so each of its 258 jobs downloaded Spring Boot, Quarkus and
      # the engines from Maven Central, twenty at a time. Central answered that with 429,
      # and the ban outlasted the pause of the retry script. A release never changes once it
      # is published, so this run loses nothing by taking it from the cache.
      - uses: actions/cache/restore@v6
        with:
          path: ~/.m2/repository
          # never matches, because only build.yaml writes caches; the restore-keys find the
          # newest one
          key: maven-${{ hashFiles('**/pom.xml') }}-${{ github.run_id }}
          restore-keys: |
            maven-${{ hashFiles('**/pom.xml') }}-
            maven-
      # What the snapshots of today need and the cache above lacks, collected by the job
      # 'cache' of this run. The step below lays it over the cache.
      - uses: actions/cache/restore@v6
        with:
          path: ~/.m2/nightly-delta
          key: nightly-delta-${{ github.run_id }}
      # "Fresh" is about our own snapshots, and those must not come from the cache. So
      # every snapshot goes, ours and any other. Maven then has nothing old to fall back on
      # and has to ask the snapshot repositories. Released VanillaBP artifacts stay, like
      # io.vanillabp:release-parent:2.0.0, the parent of the snapshot BOM: a release never
      # changes. This step used to remove all of io/vanillabp, so each of the 258 jobs asked
      # Maven Central for those releases again, and Central answered with 429 three nights in
      # a row. The '*.lastUpdated' files go too: they record a download which failed in the
      # run that wrote the cache, and Maven would not try that download again.
      - name: Remove the snapshots the cache carried in
        run: |
          repository="${HOME}/.m2/repository"
          if [ -d "${repository}" ]; then
            find "${repository}" -type d -name '*-SNAPSHOT' -prune -exec rm -rf {} +
            find "${repository}" -type f -name '*.lastUpdated' -delete
          fi
          # holds no snapshots, so it can come after the clean-up
          if [ -d "${HOME}/.m2/nightly-delta" ]; then
            mkdir -p "${repository}"
            cp -a "${HOME}/.m2/nightly-delta/." "${repository}/"
          fi
      # Written before the build, so the upload below has the name whatever the build does.
      # 'Nightly issue' builds the same name out of the job name, so the two have to agree:
      # the blueprint path with its slashes turned into dashes, then the BPMS.
      - name: The name this job uploads its test reports under
        env:
          BLUEPRINT: "${{ matrix.blueprint }}"
          BPMS: "${{ matrix.bpms }}"
        run: echo "REPORTS_NAME=test-reports-${BLUEPRINT//\//-}-${BPMS}" >> "$GITHUB_ENV"
      # Written before the build, so the upload at the end has the name whatever the build
      # does. A blueprint is a path, and a slash is not allowed in an artifact name. The
      # attempt is part of it because a re-run of a failed job uploads again into the same
      # run, and a second artifact of the same name is refused.
      - name: The name this job uploads the simulator logs under
        env:
          BLUEPRINT: "${{ matrix.blueprint }}"
          BPMS: "${{ matrix.bpms }}"
          ATTEMPT: "${{ github.run_attempt }}"
        run: echo "SIMULATOR_LOGS_NAME=simulator-logs-${BLUEPRINT//\//-}-${BPMS}-attempt-${ATTEMPT}"
          >> "$GITHUB_ENV"
      - name: Start a Camunda 8 cluster
        if: matrix.bpms == 'camunda8'
        # The address is published here rather than in the build step: a Camunda 7 build
        # must not see a configured camunda8 adapter, because VanillaBP then rightly
        # refuses to boot with no such adapter on the classpath.
        run: |
          bin/camunda8_cluster.sh start
          {
            # Two spellings of the same two properties, because the platforms read an
            # environment variable differently: one maps a name without separators onto
            # 'rest-address', the other expects the dash as an underscore. A variable which
            # matches no property is ignored, so both are set for every blueprint.
            echo "VANILLABP_ADAPTERS_CAMUNDA8_RESTADDRESS=http://localhost:8080"
            echo "VANILLABP_ADAPTERS_CAMUNDA8_REST_ADDRESS=http://localhost:8080"
            # Nothing about name clashes: every blueprint configures its own mode,
            # 'use-prefix', in its BPMS profiles. That runs on a cluster from the stock
            # image, which has multi-tenancy switched off and rejects the tenant the
            # adapter default 'by-adapter' would ask for. A VANILLABP_* entry here would
            # override what the blueprint documents, which is the thing being tested.
          } >> "$GITHUB_ENV"
      # 'install' alone, not 'install verify': install already runs every phase verify
      # has, and naming both compiled every module twice
      # Through bin/mvn_with_retry.sh, because Maven Central answers some jobs with 403 or
      # 429 even when most of what they need comes from the cache. The script repeats only
      # what the log proves to be a transfer: a failed test is reported the first time, as
      # it has to be.
      # All snapshots at once first, then the build with exactly those, so that a publish
      # during the build cannot give it parts of two platform builds. The script says more.
      - name: Resolve the current snapshots at once
        working-directory: "${{ matrix.blueprint }}"
        run: $GITHUB_WORKSPACE/bin/resolve_snapshots_at_once.sh
          -s "$GITHUB_WORKSPACE/.github/maven/settings.xml"
          --batch-mode --no-transfer-progress -P${{ matrix.bpms }}
      - name: Build against the current snapshots
        working-directory: "${{ matrix.blueprint }}"
        run: $GITHUB_WORKSPACE/bin/mvn_with_retry.sh
          -s "$GITHUB_WORKSPACE/.github/maven/settings.xml"
          --batch-mode --no-transfer-progress --no-snapshot-updates
          -P${{ matrix.bpms }} install
      # A red night used to leave nothing behind but the log of the job, so the issue it
      # opens could quote no more than the lines Maven marked as an error. An error line
      # says that a test failed. The report says what the test expected and what it got.
      # Thirty days rather than the default seven, because the Camunda 8 adapter once had
      # nine red nights open at the same time and only the newest one still had its
      # reports.
      - name: Upload the test reports of a blueprint which failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          # One artifact name per matrix entry, because two jobs uploading under one name
          # collide. The name is built by the step above: a blueprint is a path, and a
          # slash is not allowed in an artifact name.
          name: "${{ env.REPORTS_NAME }}"
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          retention-days: 30
          # A job which failed while compiling has no reports, and that is not an error.
          if-no-files-found: ignore
      # The simulators write their logs to a file and not to the console, so the build output
      # stays readable. Without this upload a red job takes those logs with it, and nobody can
      # tell any more which reports reached a simulator and in which order. The dev-shell
      # simulator of the cockpit blueprints writes target/dev-shell-simulator.log, the
      # simulator applications of module-simulator and module-under-load write
      # target/simulator.log (and roll it over into simulator.log.* when it grows).
      - name: Upload the simulator logs of a blueprint which failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: "${{ env.SIMULATOR_LOGS_NAME }}"
          path: |
            ${{ matrix.blueprint }}/**/target/dev-shell-simulator.log
            ${{ matrix.blueprint }}/**/target/simulator.log*
          # Read while the failure is looked into, and by nobody afterwards.
          retention-days: 7
          # Most blueprints start no simulator, and that is not an error.
          if-no-files-found: ignore
      - name: The Camunda 8 cluster's log, if something went wrong
        if: failure() && matrix.bpms == 'camunda8'
        run: bin/camunda8_cluster.sh logs
      - name: Stop the Camunda 8 cluster
        if: always() && matrix.bpms == 'camunda8'
        run: bin/camunda8_cluster.sh stop

  # The second part, after the first one. '!cancelled()' lets it run when the first part is
  # red, because a red blueprint should not hide the result of the others.
  freshness-2:
    needs: [discover, platform, cache, freshness-1]
    if: >-
      !cancelled() && needs.discover.result == 'success' && needs.platform.result == 'success'
      && needs.discover.outputs.part2 != '[]'
    name: freshness (${{ matrix.blueprint }} on ${{ matrix.bpms }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include: "${{ fromJSON(needs.discover.outputs.part2) }}"
    steps: *freshness-steps

  # The third part, after the second one, for the same reasons.
  freshness-3:
    needs: [discover, platform, cache, freshness-2]
    if: >-
      !cancelled() && needs.discover.result == 'success' && needs.platform.result == 'success'
      && needs.discover.outputs.part3 != '[]'
    name: freshness (${{ matrix.blueprint }} on ${{ matrix.bpms }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include: "${{ fromJSON(needs.discover.outputs.part3) }}"
    steps: *freshness-steps
