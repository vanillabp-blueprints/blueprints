openapi: 3.0.3
info:
  title: Rate watch
  description: >
    The API of the use case 'rate-watch'. It has GET requests only, so a person can walk through the
    process in a browser, without any tool and without a request body.

    The build generates the Java interface 'RateWatchApi' from this file, and 'ApiController'
    implements it. So the paths, the parameters and the answers below are the contract, and nobody
    writes them by hand.
  version: 1.0.0
servers:
  - url: http://localhost:8080
tags:
  - name: rate-watch
    description: Operating the use case 'rate-watch'
paths:
  /api/rate-watch/start:
    get:
      tags:
        - rate-watch
      operationId: start
      summary: Starts a rate watch
      responses:
        '200':
          description: The id of the watch started
          content:
            text/plain:
              schema:
                type: string
  /api/rate-watch/{watchId}:
    get:
      tags:
        - rate-watch
      operationId: show
      summary: Shows whether the watch noticed a publication yet
      parameters:
        - name: watchId
          in: path
          required: true
          description: The id returned by starting the watch
          schema:
            type: string
      responses:
        '200':
          description: The workflow aggregate as it is stored right now
          content:
            text/plain:
              schema:
                type: string
