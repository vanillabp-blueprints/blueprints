openapi: 3.0.3
info:
  title: Nightly review
  description: >
    The API of the use case 'nightly-review'. It has GET requests only, so a person can walk through
    the process in a browser, without any tool and without a request body.

    The build generates the Java interface 'NightlyReviewApi' from this file, and 'ApiController'
    implements it. So the paths, the parameters and the answers below are the contract, and nobody
    writes them by hand.
  version: 1.0.0
servers:
  - url: http://localhost:8080
tags:
  - name: nightly-review
    description: Operating the use case 'nightly-review'
paths:
  /api/nightly-review/request:
    get:
      tags:
        - nightly-review
      operationId: request
      summary: Asks for a review by broadcasting the signal
      responses:
        '200':
          description: What was done, for the browser to show
          content:
            text/plain:
              schema:
                type: string
  /api/nightly-review:
    get:
      tags:
        - nightly-review
      operationId: listReviews
      summary: Lists the reviews that ran, whoever started them
      responses:
        '200':
          description: Every review this application has seen
          content:
            text/plain:
              schema:
                type: string
  /api/nightly-review/{reviewId}:
    get:
      tags:
        - nightly-review
      operationId: show
      summary: Shows one review
      parameters:
        - name: reviewId
          in: path
          required: true
          description: The ID VanillaBP assigned
          schema:
            type: string
      responses:
        '200':
          description: The workflow aggregate as it is stored right now
          content:
            text/plain:
              schema:
                type: string
