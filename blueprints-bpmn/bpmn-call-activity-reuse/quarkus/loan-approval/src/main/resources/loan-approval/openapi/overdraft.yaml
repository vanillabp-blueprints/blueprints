openapi: 3.0.3
info:
  title: Overdraft request
  description: >
    The API of the use case 'overdraft'. It has GET requests only, so a person can walk through the
    process in a browser, without any tool and without a request body.

    The build generates the Java interface 'OverdraftApi' from this file, and 'ApiController'
    implements it. So the paths, the parameters and the answers below are the contract, and nobody
    writes them by hand.
  version: 1.0.0
servers:
  - url: http://localhost:8080
tags:
  - name: overdraft
    description: Operating the use case 'overdraft'
paths:
  /loan-approval/api/overdrafts/start:
    get:
      tags:
        - overdraft
      operationId: start
      summary: Starts an overdraft request
      parameters:
        - name: limit
          in: query
          description: The overdraft limit asked for
          schema:
            type: integer
            default: 1000
      responses:
        '200':
          description: The id of the overdraft request started
          content:
            text/plain:
              schema:
                type: string
  /loan-approval/api/overdrafts/{overdraftId}:
    get:
      tags:
        - overdraft
      operationId: show
      summary: Shows what the process did
      parameters:
        - name: overdraftId
          in: path
          required: true
          description: The id returned by starting the process
          schema:
            type: string
      responses:
        '200':
          description: The workflow aggregate as it is stored right now
          content:
            text/plain:
              schema:
                type: string
