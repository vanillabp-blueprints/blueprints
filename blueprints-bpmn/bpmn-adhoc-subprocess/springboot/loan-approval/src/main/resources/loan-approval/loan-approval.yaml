# Configuration of the workflow module 'loan-approval'.
#
# The file is named after the workflow module ID and is loaded automatically, with a
# higher priority than application.yaml. Everything only this module needs belongs here -
# that is what keeps a workflow module a self-contained application inside the
# application.
loan-approval:
  rating-scale: 100

# Two values of the aggregate reach the BPMS as something other than a boolean or a text,
# so both are declared.
vanillabp:
  workflow-modules:
    loan-approval:
      workflows:
        loan_approval:
          declared-aggregate-values:
            # a number, which does not mean the same in every expression language
            - amount
            # the list of checks the ad-hoc subprocess picks its activities from: the
            # engine needs the collection itself, not a decision derived from it
            - checksToRun
