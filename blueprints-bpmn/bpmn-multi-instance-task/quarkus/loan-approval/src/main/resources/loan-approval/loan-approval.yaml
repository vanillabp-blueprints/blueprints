# Configuration of the workflow module 'loan-approval'.
#
# The file is named after the workflow module ID and is loaded automatically, with a
# higher priority than application.yaml. Everything only this module needs belongs here -
# that is what keeps a workflow module a self-contained application inside the
# application.
loan-approval:
  rating-scale: 100
  # One iteration of the multi-instance task per partner. Adding one here changes how often
  # the task runs, without the BPMN being touched and without a deployment.
  partners:
    - id: northern-bank
      spread: 45
    - id: harbour-credit
      spread: 20
    - id: alpine-savings
      spread: 35

# The list the model loops over reaches the BPMS, and a list is neither a boolean nor a
# text, so it is declared. A multi-instance task needs the collection itself: it counts the
# entries to know how often it runs, and no boolean getter can answer that.
vanillabp:
  workflow-modules:
    loan-approval:
      workflows:
        loan_approval:
          declared-aggregate-values:
            - partnerIds
