# Configuration of the workflow module 'loan-approval'.
#
# The file is named after the workflow module ID and is loaded automatically, with a
# lower priority than application.yaml. Everything only this module needs belongs here -
# that is what keeps a workflow module a self-contained application inside the
# application.
loan-approval:
  rating-scale: 100
  # One iteration of the multi-instance task per partner. Adding one here changes how often
  # the task runs, without the BPMN being touched and without a deployment.
  partners:
    - id: northern-bank
      spread: 45
    - id: harbour-credit
      spread: 20
    - id: alpine-savings
      spread: 35

# The list the model loops over reaches the BPMS, and a list is neither a boolean nor a
# text, so it is declared. A multi-instance task needs the collection itself: it counts the
# entries to know how often it runs, and no boolean getter can answer that.
vanillabp:
  workflow-modules:
    loan-approval:
      workflows:
        loan_approval:
          declared-aggregate-values:
            - partnerIds
          # Every instance of the multi-instance task is a token of its own, and the aggregate has
          # no version attribute. So VanillaBP warns at startup that two instances may overwrite
          # each other. Here they do not: an instance only adds a PartnerOffer, which is a row of
          # its own table, and the row of the aggregate is not written. VanillaBP cannot see that
          # in the code, so the review is stated here, and the warning stays silent. Whoever
          # changes the model checks again whether this line still holds.
          concurrent-branches-reviewed: true
