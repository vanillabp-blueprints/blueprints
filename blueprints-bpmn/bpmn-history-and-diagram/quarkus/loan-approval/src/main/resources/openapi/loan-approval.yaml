openapi: 3.0.3
info:
  title: Loan approval
  description: >
    The API of the use case 'loan-approval'. It has GET requests only, so a person can walk
    through the process in a browser, without any tool and without a request body.

    The build generates the Java interface 'LoanApprovalApi' from this file, and 'ApiController'
    implements it. So the paths, the parameters and the answers below are the contract, and
    nobody writes them by hand.

    The schemas 'ProcessDefinition', 'WorkflowHistory' and 'WorkflowElementHistory' describe
    what VanillaBP returns. The build maps them to the types of VanillaBP instead of generating
    classes of its own, so the controller hands on what the 'ProcessService' gives it.
  version: 1.0.0
servers:
  - url: http://localhost:8080
tags:
  - name: loan-approval
    description: Operating the use case 'loan-approval', and looking at its process
paths:
  /api/loan-approval/start:
    get:
      tags:
        - loan-approval
      operationId: start
      summary: Starts a loan approval
      parameters:
        - name: amount
          in: query
          description: The amount requested
          schema:
            type: integer
            default: 5000
      responses:
        '200':
          description: The id of the loan request started
          content:
            text/plain:
              schema:
                type: string
  /api/loan-approval/{loanRequestId}/approve:
    get:
      tags:
        - loan-approval
      operationId: approve
      summary: Moves the waiting workflow on
      parameters:
        - $ref: '#/components/parameters/LoanRequestId'
      responses:
        '200':
          description: What happened
          content:
            text/plain:
              schema:
                type: string
  /api/loan-approval/{loanRequestId}:
    get:
      tags:
        - loan-approval
      operationId: show
      summary: Shows what the process did, which is the second half of operating it in a browser
      parameters:
        - $ref: '#/components/parameters/LoanRequestId'
      responses:
        '200':
          description: The workflow aggregate as it is stored right now
          content:
            text/plain:
              schema:
                type: string
  /api/loan-approval/{loanRequestId}/definitions:
    get:
      tags:
        - loan-approval
      operationId: definitions
      summary: The process definitions the workflow uses
      description: A viewer starts here. It needs an id before it can ask for a diagram.
      parameters:
        - $ref: '#/components/parameters/LoanRequestId'
        - $ref: '#/components/parameters/HistoryContext'
      responses:
        '200':
          description: The definitions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProcessDefinition'
  /api/loan-approval/{loanRequestId}/diagram:
    get:
      tags:
        - loan-approval
      operationId: diagram
      summary: The BPMN XML of the workflow's process, or of one of the definitions
      parameters:
        - $ref: '#/components/parameters/LoanRequestId'
        - name: processDefinitionId
          in: query
          description: The definition to show. Without it, the one the workflow runs on
          schema:
            type: string
      responses:
        '200':
          description: The BPMN XML
          content:
            application/xml:
              schema:
                type: string
                format: binary
  /api/loan-approval/{loanRequestId}/history:
    get:
      tags:
        - loan-approval
      operationId: history
      summary: What the workflow has done so far
      description: >
        The elements the workflow passed, in the order it ran them, with the times a viewer
        colours by.
      parameters:
        - $ref: '#/components/parameters/LoanRequestId'
        - $ref: '#/components/parameters/HistoryContext'
      responses:
        '200':
          description: The history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowHistory'
components:
  parameters:
    LoanRequestId:
      name: loanRequestId
      in: path
      required: true
      description: The id returned by starting the process
      schema:
        type: string
    HistoryContext:
      name: historyContext
      in: query
      description: The context of a call activity. Without it, the workflow itself
      schema:
        type: string
  schemas:
    ProcessDefinition:
      type: object
      properties:
        id:
          type: string
          description: The id of the process definition, a string nobody should parse
        bpmnProcessId:
          type: string
          description: The id of the process in the BPMN file
        version:
          type: string
          description: The version of the process, a string nobody should parse
        usedByElements:
          type: array
          nullable: true
          description: >
            Null for the main process definition of the workflow. For any other one, the ids of
            the call activities which use it
          items:
            type: string
    WorkflowHistory:
      type: object
      properties:
        processDefinitionId:
          type: string
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
          nullable: true
          description: Empty while the workflow runs
        elementsHistory:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowElementHistory'
    WorkflowElementHistory:
      type: object
      properties:
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
          nullable: true
        elementId:
          type: string
        elementType:
          type: string
          description: The kind of BPMN element, for example SERVICE_TASK or USER_TASK
        error:
          type: string
          nullable: true
        isCanceled:
          type: boolean
        secondaryWorkflowHistoryContext:
          type: string
          nullable: true
          description: The history context to pass for the process a call activity started
