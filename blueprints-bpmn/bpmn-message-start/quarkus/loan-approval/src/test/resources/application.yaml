# The configuration of the module's own test. The only thing it says beyond the database is
# where the BPMN files are: in the application this workflow module is a dependency, so its
# models are looked for below its ID and nothing has to be configured, while here the module
# is the artifact being run, and for an application which IS the workflow module the
# convention drops the ID. Naming the location puts the test back onto the files the module
# ships.
#
# '${bpms}' is the BPMS of the active Maven profile, filled in while the file is copied. The
# location is per adapter, and so is the profile - this is the one place the module's test
# knows which engine it runs on.
quarkus:
  datasource:
    db-kind: h2
    username: sa
    jdbc:
      url: jdbc:h2:mem:message-start-test;DB_CLOSE_DELAY=-1
  hibernate-orm:
    schema-management:
      strategy: drop-and-create
  log:
    category:
      "blueprint.workflowmodule":
        level: INFO
vanillabp:
  workflow-modules:
    loan-approval:
      adapters:
        "${bpms}":
          resources-location: classpath*:loan-approval/processes/${bpms}
