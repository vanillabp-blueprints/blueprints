# Configuration of the workflow module 'loan-approval'.
#
# The file is named after the workflow module ID and is loaded automatically, with a
# higher priority than application.yaml. Everything only this module needs belongs here -
# that is what keeps a workflow module a self-contained application inside the
# application.
loan-approval:
  rating-scale: 100

# The inputs of a decision table are numbers, which is what a decision table is for, so
# they are declared instead of being turned into boolean getters. This is the case the
# rule about portable values was written with in mind.
vanillabp:
  workflow-modules:
    loan-approval:
      workflows:
        loan_approval:
          declared-aggregate-values:
            - amount
            - creditRating
