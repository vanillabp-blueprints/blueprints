# Configuration of the workflow module 'loan-approval'.
#
# The file is named after the workflow module ID and is loaded automatically, with a
# higher priority than application.yaml. Everything only this module needs belongs here -
# that is what keeps a workflow module a self-contained application inside the
# application.
loan-approval:
  rating-scale: 100
  # One iteration of the SUBPROCESS per region: the whole assessment runs again.
  regions:
    - id: north
      surcharge: 0
    - id: south
      surcharge: 15
  # One iteration of the task INSIDE the subprocess per partner, in every region.
  partners:
    - id: northern-bank
      spread: 20
    - id: harbour-credit
      spread: 35

# The two lists the model loops over reach the BPMS, and a list is neither a boolean nor a
# text, so both are declared. A multi-instance element needs the collection itself: it
# counts the entries to know how often it runs, and no boolean getter can answer that.
vanillabp:
  workflow-modules:
    loan-approval:
      workflows:
        loan_approval:
          declared-aggregate-values:
            # one iteration of the subprocess per region
            - regionIds
            # one iteration of the task inside it per partner
            - partnerIds
