# Everything specific to Operaton, loaded only while the 'operaton' profile applies. The
# Maven profile of the same name activates it, so the BPMS is chosen once.
vanillabp:
  adapters:
    operaton:
      # The identifiers of this workflow module are prefixed in the BPMS, which keeps modules
      # apart without a tenant, and a BPMS is licensed per tenant. BPMN files, business code and
      # configuration keep the plain names, the adapter translates at every boundary. Switching
      # the mode of a running application is a migration rather than a setting.
      name-clash-avoidance: use-prefix
      # The list the model loops over has no variable type in Operaton, so the engine stores it
      # as an object. Without a format that object is Java serialization, which the web
      # applications cannot show. JSON can be read. The SPIN plugin, a dependency of this
      # profile, provides the format, and the engine learns about the plugin here.
      serialization-format: application/json
      engine-plugins:
        spin:
          plugin-class: org.operaton.spin.plugin.impl.SpinProcessEnginePlugin
