spring:
  datasource:
    url: jdbc:h2:mem:timer-test;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    # No database session stays open while a response is written, so every read of an
    # aggregate happens inside a transaction of the service. Set on purpose, because Spring
    # Boot warns at every start while it is not set.
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
logging:
  level:
    blueprint.workflowmodule: INFO
# The partner deadline of the module is three days. The test shortens it here, because a
# test which waits three days is no test. The model is the same one the application runs,
# only the value the aggregate copies is shorter.
loan-approval:
  partner-deadline: PT3S
