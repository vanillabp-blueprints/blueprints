# Configuration of the workflow module 'loan-approval'.
#
# The file is named after the workflow module ID and is loaded automatically, with a
# lower priority than application.yaml. Everything only this module needs belongs here -
# that is what keeps a workflow module a self-contained application inside the
# application.
loan-approval:
  rating-scale: 100
  # How long the partner may take to answer, and the time the office closes. The partner gets
  # the period and then the rest of that day until the office closes. These are the business
  # values. When the loan is requested, the aggregate works out the end of the deadline and
  # keeps it, and the timer boundary event on the waiting task reads it from there. A test or
  # a demo shortens it in its own configuration, which wins over this file.
  partner-deadline: P3D
  office-closes-at: "17:00"
  # The time zone of the business. "The office closes at 17:00" means 17:00 in this zone, also
  # on a machine which runs on UTC. Never set the time zone of the machine instead: it changes
  # every other module of the application as well.
  zone: Europe/Vienna
