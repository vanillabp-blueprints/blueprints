# The configuration of the module's own test: its database, and nothing else. Where the
# BPMN files are is a convention VanillaBP knows, on both sides of the split.
quarkus:
  datasource:
    db-kind: h2
    username: sa
    jdbc:
      url: jdbc:h2:mem:timer-test;DB_CLOSE_DELAY=-1
  hibernate-orm:
    schema-management:
      strategy: drop-and-create
  log:
    category:
      "blueprint.workflowmodule":
        level: INFO
# The partner deadline of the module is three days and the rest of the day until the office
# closes. The test shortens it to one minute and no closing time, because a test which
# waits three days is no test. The model is the same one the application runs, only the value
# the aggregate keeps is earlier. The deadline counts from the request, so it has to be clearly
# longer than the cool-off period of a large loan, twenty seconds. On a busy machine the engine
# fires that timer some seconds late, and with thirty seconds the deadline was sometimes over
# before the test could answer.
#
# The time zone is one no build machine runs in, fourteen hours ahead of UTC. So the test of
# the deadline only passes if the BPMS reads the offset of the deadline. Without the offset,
# one BPMS would fire the timer hours late and another would refuse the date, and that test
# would time out.
loan-approval:
  partner-deadline: PT60S
  office-closes-at: ""
  zone: Pacific/Kiritimati
