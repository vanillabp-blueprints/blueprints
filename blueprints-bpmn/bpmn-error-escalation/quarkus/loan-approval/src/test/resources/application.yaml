# The configuration of the module's own test: its database, and nothing else. Where the
# BPMN files are is a convention VanillaBP knows, on both sides of the split.
quarkus:
  datasource:
    db-kind: h2
    username: sa
    jdbc:
      url: jdbc:h2:mem:error-escalation-test;DB_CLOSE_DELAY=-1
  hibernate-orm:
    schema-management:
      strategy: drop-and-create
  log:
    category:
      "blueprint.workflowmodule":
        level: INFO
