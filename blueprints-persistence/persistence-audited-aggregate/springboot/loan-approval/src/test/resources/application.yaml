spring:
  datasource:
    url: jdbc:h2:mem:loan-approval-test;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    # No database session stays open while a response is written, so every read of an
    # aggregate happens inside a transaction of the service. Set on purpose, because Spring
    # Boot warns at every start while it is not set.
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
vanillabp:
  outbox:
    # The compliance archive is away when the notice first arrives, so the test waits for
    # the second attempt. Half a minute is what VanillaBP keeps between attempts by
    # default, which is right for a receiver which is really down and too long for a
    # build.
    attempt-frequency: 2s
    poll-interval: 2s
logging:
  level:
    blueprint.workflowmodule: INFO
