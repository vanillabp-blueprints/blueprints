# The configuration of the module's own test. There is no data source and no connection
# string either: MongoDbForTests starts a MongoDB container and points the client at it,
# which is why nothing here says where the database is.
#
# Where the BPMS is lives in the profile file of that engine, 'application-camunda8.yaml'.
logging:
  level:
    blueprint.workflowmodule: INFO
