# The configuration of the module's own test. There is no data source and no connection
# string either: the platform's dev services start a MongoDB for the test and point the
# client at it, and they run it as a replica set, which is what MongoDB transactions need.
#
# Where the BPMS is lives in the profile file of that engine, 'application-camunda8.yaml'.
quarkus:
  mongodb:
    database: loan-approval
  log:
    category:
      "blueprint.workflowmodule":
        level: INFO
