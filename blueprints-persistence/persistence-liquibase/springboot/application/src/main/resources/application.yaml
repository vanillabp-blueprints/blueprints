# Only what is truly cross-cutting belongs here. Everything the workflow module needs is
# in its own configuration file (loan-approval/loan-approval.yaml inside the module JAR).
#
# Nothing about a BPMS is here either. That lives in a profile file per engine,
# 'application-camunda7.yaml' and 'application-camunda8.yaml', so switching engines is a
# profile and not an edit. One adapter dependency and one workflow module are enough for
# VanillaBP to derive the adapter, the workflow module and where its BPMN files are read
# from.
spring:
  # The BPMS is chosen by the Maven profile, and this is where that choice reaches the
  # application: the build replaces the placeholder with the profile's name, so
  # 'application-camunda7.yaml' respectively 'application-camunda8.yaml' is loaded without
  # anybody having to name the profile twice. Tests get the same value as a system property.
  profiles:
    active: "@bpms@"
  datasource:
    url: jdbc:h2:mem:loan-approval;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      # Hibernate creates nothing and only checks that what the migrations built matches
      # the entities. Every other blueprint uses 'create-drop', because it talks about
      # something else; this one is about the schema, and in a project past its first
      # prototype nobody lets a runtime create tables.
      ddl-auto: validate
vanillabp:
  outbox:
    # The tables VanillaBP would create at startup come from Liquibase here. With this
    # switch off, VanillaBP instead CHECKS at startup that they exist and ends the boot
    # naming the table and this property, rather than failing at the first workflow that
    # is started. Note that it covers the outbox of the Spring Boot integration as well,
    # which is why db/gruelbox-outbox.xml exists.
    create-schema: false
blueprint:
  schema:
    # The changelog the application applies. The engine decides which one: a remote engine
    # has no tables of its own, an embedded one has, so the profile of the engine may
    # override this (see application-camunda7.yaml).
    changelog: classpath:db/changelog.xml
logging:
  level:
    blueprint.workflowmodule: INFO
