# The configuration of the module's own test: its database and its own migration. What
# VanillaBP needs is not part of it - those tables belong to the application, and here
# VanillaBP creates them itself, as it does in every other blueprint. The application's test
# is where the handover of ALL tables is shown.
quarkus:
  datasource:
    db-kind: h2
    username: sa
    jdbc:
      url: jdbc:h2:mem:loan-approval-test;DB_CLOSE_DELAY=-1
  liquibase:
    # The module's own changelog, applied by the extension. An application names this file in
    # ITS changelog instead, with one include line, and the module's changesets stay the
    # module's either way: they carry their own logical path.
    change-log: loan-approval/db/changelog.xml
    migrate-at-start: true
  hibernate-orm:
    schema-management:
      # The module's own changelog creates its table, Hibernate only checks the result.
      strategy: validate
  log:
    category:
      "blueprint.workflowmodule":
        level: INFO
