# Only what is truly cross-cutting belongs here. Everything the workflow module needs is
# in its own configuration file (loan-approval/loan-approval.yaml inside the module JAR).
#
# Nothing about a BPMS is here either. That lives in a profile file per engine - here only
# 'application-camunda8.yaml', because Camunda 8 is remote and needs an address while
# Camunda 7 needs nothing beyond its dependency. Switching engines is therefore a profile
# and not an edit. One adapter dependency and one workflow module are enough for VanillaBP
# to derive the adapter, the workflow module and where its BPMN files are read from.
quarkus:
  # The BPMS is chosen by the Maven profile, and this is where that choice reaches the
  # application: the build replaces the placeholder with the profile's name, and the profile
  # file of that engine applies from then on - whichever profile the application itself runs
  # in, because the BPMS profile is its PARENT. Nobody has to name the profile twice.
  config:
    profile:
      parent: "@bpms@"
  datasource:
    db-kind: h2
    username: sa
    jdbc:
      url: jdbc:h2:mem:loan-approval;DB_CLOSE_DELAY=-1
  mongodb:
    # The second aggregate lives here. Deliberately without a connection string: while
    # developing and testing, the platform's dev services start a MongoDB and connect to it,
    # and they run it as a replica set, which is what MongoDB transactions need. Naming an
    # address here would switch that off.
    #
    #   connection-string: mongodb://localhost:27017/?replicaSet=rs0
    database: loan-approval
  hibernate-orm:
    schema-management:
      strategy: drop-and-create
  log:
    category:
      "blueprint.workflowmodule":
        level: INFO
