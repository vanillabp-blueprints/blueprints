# Configuration of the workflow module 'loan-approval'.
#
# The file is named after the workflow module ID and is loaded automatically, with a
# lower priority than application.yaml. Everything only this module needs belongs here -
# that is what keeps a workflow module a self-contained application inside the
# application.
loan-approval:
  rating-scale: 100

# The parallel gateway puts a second token into the process, and the aggregate has no version
# attribute. So VanillaBP warns at startup that two branches may overwrite each other. Here they
# do not: each branch writes an entity of its own, and @DynamicUpdate on the aggregate keeps the
# foreign key of one branch out of the write of the other. VanillaBP cannot see that in the code,
# so the review is stated here, and the warning stays silent. The key is read at the workflow
# only. Whoever changes the model checks again whether this line still holds.
vanillabp:
  workflow-modules:
    loan-approval:
      workflows:
        loan_approval:
          concurrent-branches-reviewed: true
