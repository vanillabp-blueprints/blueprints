# Only what is truly cross-cutting belongs here. Everything the workflow module needs is
# in its own configuration file (loan-approval/loan-approval.yaml inside the module JAR).
#
# Nothing about a BPMS is here either. That lives in a profile file per engine, so switching
# engines is a profile and not an edit. The migrations of an embedded engine join in through the
# profile file of that engine.
#
# One adapter dependency and one workflow module are enough for VanillaBP to derive the
# adapter, the workflow module and where its BPMN files are read from.
quarkus:
  # The BPMS is chosen by the Maven profile, and this is where that choice reaches the
  # application: the build replaces the placeholder with the profile's name, and the profile
  # files 'application-camunda7.yaml' respectively 'application-camunda8.yaml' apply from
  # then on - whichever profile the application itself runs in, because they are its PARENT.
  # Nobody has to name the profile twice.
  config:
    profile:
      parent: "@bpms@"
  datasource:
    db-kind: h2
    username: sa
    jdbc:
      url: jdbc:h2:mem:loan-approval;DB_CLOSE_DELAY=-1
  flyway:
    # ONE migration run with ONE history table, and that is a property of this platform rather than
    # a preference: the Flyway extension applies one configuration per datasource, and a migration
    # run of our own would come too late, because Hibernate builds its session factory - and with
    # 'validate' compares it against the schema - before any startup observer runs.
    #
    # So every owner's migrations are applied in the same timeline: VanillaBP's out of its artifact,
    # the workflow module's out of its JAR, the application's own, and those of an embedded engine
    # which the build put into db/migration-engine.
    #
    # The price is that the version numbers have to stay apart. Flyway has no notion of who wrote a
    # migration, so two owners picking the same number collide - loudly, with "Found more than one
    # migration with version X" while starting, never silently. VanillaBP numbers its own in 2.x,
    # the engine uses its version, and what this application and its modules pick is up to them.
    locations: classpath:vanillabp/schema/flyway/h2,classpath:loan-approval/db/migration,classpath:db/migration,classpath:db/migration-engine
    migrate-at-start: true
  hibernate-orm:
    schema-management:
      # Hibernate creates nothing and only checks that what the migrations built matches the
      # entities. Every other blueprint uses 'drop-and-create', because it talks about
      # something else; this one is about the schema, and in a project past its first
      # prototype nobody lets a runtime create tables.
      strategy: validate
  log:
    category:
      "blueprint.workflowmodule":
        level: INFO
vanillabp:
  outbox:
    # The tables VanillaBP would create at startup come from Flyway here. With this switch off,
    # VanillaBP instead CHECKS at startup that they exist and ends the boot naming the table and
    # this property, rather than failing at the first workflow that is started.
    create-schema: false
