# The configuration of the module's own test: its database, and the payout run. The test
# waits for the payout run, so it comes every five seconds here instead of every twenty.
quarkus:
  datasource:
    db-kind: h2
    username: sa
    jdbc:
      url: jdbc:h2:mem:loan-approval-test;DB_CLOSE_DELAY=-1
  hibernate-orm:
    schema-management:
      strategy: drop-and-create
  log:
    category:
      "blueprint.workflowmodule":
        level: INFO
loan-approval:
  payout-run-every: PT5S
