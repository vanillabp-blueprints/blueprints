# The configuration of the module's own test: its database, and the payout run. The test
# waits for the payout run, so it comes every five seconds here instead of every twenty.
spring:
  datasource:
    url: jdbc:h2:mem:loan-approval-test;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    # No database session stays open while a response is written, so every read of an
    # aggregate happens inside a transaction of the service. Set on purpose, because Spring
    # Boot warns at every start while it is not set.
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
loan-approval:
  payout-run-every: PT5S
logging:
  level:
    blueprint.workflowmodule: INFO
