# Only what is truly cross-cutting belongs here. Everything the workflow module needs is in its
# own file (loan-approval/loan-approval.yaml inside the module JAR).
spring:
  profiles:
    # Two choices, each a profile. The BPMS is chosen by the Maven profile: the build replaces
    # the placeholder with its name, so 'application-<bpms>.yaml' is loaded. The systems around
    # the application are chosen by 'external-systems': 'local' (the default) points every
    # adapter at the simulator, 'real' at the real systems. Switch with the environment
    # variable EXTERNAL_SYSTEMS=real. Tests get both values as a system property.
    active: "@bpms@,${external-systems:local}"
  datasource:
    url: jdbc:h2:mem:loan-approval;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
logging:
  level:
    blueprint: INFO
