# Configuration of the workflow module 'loan-approval'.
#
# The file is named after the workflow module ID and is loaded automatically, with a lower
# priority than application.yaml. Everything only this module needs belongs here.
#
# What is not here: the addresses of the systems around the module. The module knows them only
# by their ports. The addresses belong to the adapters, and the application sets them per
# profile, 'local' for the simulator and 'real' for the real systems.
loan-approval:
  minimum-credit-score: 600
vanillabp:
  workflow-modules:
    loan-approval:
      # What the Business Cockpit has to know about this module. Where the cockpit server is,
      # is not a matter of the module. The application writes it, below 'vanillabp.cockpit'.
      # https://github.com/vanillabp/business-cockpit/wiki/Configuration#what-a-workflow-module-tells-the-cockpit
      cockpit:
        # Where the cockpit reaches this module. This blueprint has no user interface for its
        # user task, so the cockpit can show the task but not a form for it. The blueprints
        # 'cockpit-user-task-*' show how a module brings its forms.
        workflow-module-uri: http://localhost:8080/loan-approval
        ui-uri-type: ES_MODULES
        ui-uri-path: /bc-manifest.json
        i18n-languages:
          - en
        # The names in the BPMN files are English. They become the titles in the cockpit.
        bpmn-description-language: en
        # Who caused a report. This blueprint has no login, so the system is named.
        initiator-source: system
