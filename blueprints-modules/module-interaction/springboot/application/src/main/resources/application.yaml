# Only what is truly cross-cutting belongs here: the database both workflow modules store
# their aggregates in, and the profile which chooses the BPMS. Everything a module needs is
# in the module's own file (loan-approval/loan-approval.yaml, risk-assessment/risk-assessment.yaml
# inside the module JARs), and this file must not know those values exist.
#
# What is also not here: a word about the modules themselves. No component scan, no entity
# scan, no repository configuration - each module brings an auto-configuration and wires
# itself, which is what makes it a JAR somebody else could publish.
spring:
  # The BPMS is chosen by the Maven profile, and this is where that choice reaches the
  # application: the build replaces the placeholder with the profile's name, so
  # 'application-camunda7.yaml' respectively 'application-camunda8.yaml' is loaded without
  # anybody having to name the profile twice. Tests get the same value as a system property.
  profiles:
    active: "@bpms@"
  datasource:
    url: jdbc:h2:mem:online-banking;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
logging:
  level:
    blueprint: INFO
