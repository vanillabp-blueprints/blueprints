# Everything specific to CIB seven while the test runs. The Maven profile of the same name
# makes it the parent profile of the test's own profile, so the BPMS is chosen once.
vanillabp:
  adapters:
    cibseven:
      # The same mode as in the application's profile file, so this test runs the
      # configuration the blueprint ships. Without this line the test would fall back to the
      # default 'by-adapter' and address CIB seven differently than the application does.
      name-clash-avoidance: use-prefix
      # The embedded job executor waits for the next due job instead of asking every 5 to 60
      # seconds. Without this key the test would see those questions in its database.
      sleep-until-something-is-due: true
