# Configuration of the workflow module 'loan-approval'.
#
# The file is named after the workflow module ID and is loaded automatically, with a
# higher priority than application.yaml. Everything only this module needs belongs here -
# that is what keeps a workflow module a self-contained application inside the
# application.
loan-approval:
  rating-scale: 100
  # Where H2 writes down the statements it executes, which the endpoint
  # /api/loan-approval/statements counts. It is next to the database file, so it follows
  # whatever the JDBC URL of this application says. Measuring equipment, not something a
  # workflow module needs.
  database-trace: target/loan-approval.trace.db
