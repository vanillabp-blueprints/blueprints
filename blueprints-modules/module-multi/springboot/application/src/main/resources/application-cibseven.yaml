# Everything specific to CIB seven, loaded only while the 'cibseven' profile is active.
# The Maven profile of the same name activates it, so the BPMS is chosen once.
vanillabp:
  adapters:
    cibseven:
      # With two workflow modules the identifiers they use are no longer guaranteed to be
      # unique: both could name a process 'loan_approval' without either of them knowing.
      # VanillaBP prefixes them with the module id before they reach the engine and strips
      # the prefix off again on the way back, so the BPMN files, the business code and this
      # configuration keep using the plain names. The other two modes, and why changing the
      # mode later is a migration, are in the README.
      name-clash-avoidance: use-prefix
      webapps:
        # A demo administrator, so the blueprint can be operated without setting one up.
        # An application with an identity provider of its own leaves this section out and
        # the web applications use that instead.
        admin-user:
          id: demo
          password: demo
          first-name: Demo
          last-name: User

# CIB seven's new webclient at /webapp comes with the web applications. It signs its
# login tokens with this secret and does not start without one. The value is for the
# demo only. A real application sets its own, the same on every instance, for example
# from an environment variable. Make one with: openssl rand -base64 120 | tr -d '\n'
cibseven:
  webclient:
    authentication:
