openapi: 3.0.3
info:
  title: Test API of the simulator
  version: 1.0.0
  description: |
    The test API of the simulator. It prepares what a simulated system knows and makes a system act, for example sign a contract. It knows nothing about loans or workflows. Which steps a test needs, and in which order, only the process driver and the test know.

    A simulated system acts like the real one. Some of its behaviour depends on the data it gets, for example on the name of the signer of a document. This API controls what cannot be said with data, for example a report about a document the service never got.

    Every action is a GET, so a person can use it in a browser as well, like the API of the application. The Maven module 'server' generates the interfaces the controllers of the simulator implement. The Maven module 'client' generates the client the process driver uses.
servers:
  - url: http://localhost:8079
tags:
  - name: Status
    description: Whether the simulator runs
  - name: CreditRatingTest
    description: What the simulated credit rating knows
  - name: ESignatureTest
    description: "What the simulated e-signature service holds, and what it does"
paths:
  /simulator/test-api/status:
    get:
      tags:
        - Status
      operationId: status
      summary: Says that the simulator runs
      description: "A test asks this before it starts, and skips when nobody answers."
      responses:
        "200":
          description: Always 'running'
          content:
            text/plain:
              schema:
                type: string
  /simulator/test-api/credit-rating/next-id:
    get:
      tags:
        - CreditRatingTest
      operationId: nextId
      summary: Reserves a customer id nobody used before
      description: A test which takes its customer from here does not collide with
        a test which runs at the same time.
      responses:
        "200":
          description: The reserved customer id
          content:
            text/plain:
              schema:
                type: string
  /simulator/test-api/credit-rating/create-rating:
    get:
      tags:
        - CreditRatingTest
      operationId: createRating
      summary: Sets the score of a customer
      description: "The caller chooses the id, either a reserved one or one of its\
        \ own."
      parameters:
        - name: customerId
          in: query
          required: true
          schema:
            type: string
        - name: score
          in: query
          required: true
          description: The score the credit rating answers from now on
          schema:
            type: integer
      responses:
        "200":
          description: The customer id
          content:
            text/plain:
              schema:
                type: string
  /simulator/test-api/e-signature/envelope:
    get:
      tags:
        - ESignatureTest
      operationId: envelope
      summary: The document the service holds under an id
      parameters:
        - $ref: "#/components/parameters/ContractId"
      responses:
        "200":
          description: "The document, as the e-signature service received it"
          content:
            application/json:
              schema:
                $ref: ../../external-systems/e-signature/e-signature-api/e-signature.yaml#/components/schemas/Envelope
        "404":
          description: The service holds no document of this id
  /simulator/test-api/e-signature/sign:
    get:
      tags:
        - ESignatureTest
      operationId: sign
      summary: Signs a document and reports it to the callback address of its envelope
      description: |
        The real service does this after the person signed. The callback runs before the answer, so the caller learns at once whether the application took the report. This works for every signer, also for one whose name makes the service act on its own.
      parameters:
        - $ref: "#/components/parameters/ContractId"
      responses:
        "200":
          description: "The report, and how the application answered it"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SentCallback"
        "404":
          description: The service holds no document of this id
          content:
            text/plain:
              schema:
                type: string
        "502":
          description: "The application did not answer, or the callback address does\
            \ not end with the path of the callback API"
          content:
            text/plain:
              schema:
                type: string
  /simulator/test-api/e-signature/send-callback:
    get:
      tags:
        - ESignatureTest
      operationId: sendCallback
      summary: "Sends a report the way the service does, also for a document it does\
        \ not hold"
      description: |
        A real service may report a document the receiver does not know, for example after the receiver lost its data, or because another system uses the same callback address. A test of the receiver needs such a report, and no envelope could lead to it. The callback runs before the answer.
      parameters:
        - $ref: "#/components/parameters/ContractId"
        - name: status
          in: query
          required: true
          description: What the report says
          schema:
            $ref: "#/components/schemas/SignatureStatus"
        - name: callbackUrl
          in: query
          required: true
          description: "Where to send the report. It ends with the path of the callback\
            \ API, like the callback address of an envelope."
          schema:
            type: string
      responses:
        "200":
          description: "The report, and how the application answered it"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SentCallback"
        "502":
          description: "The application did not answer, or the callback address does\
            \ not end with the path of the callback API"
          content:
            text/plain:
              schema:
                type: string
  /simulator/test-api/e-signature/callbacks:
    get:
      tags:
        - ESignatureTest
      operationId: callbacks
      summary: The reports the service sent about a document so far
      description: |
        A test waits here until the service acted on its own, for example declined a contract, and the application answered.
      parameters:
        - $ref: "#/components/parameters/ContractId"
      responses:
        "200":
          description: "The reports in the order they were sent, empty if there are\
            \ none"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SentCallback"
  /simulator/test-api/e-signature/refusals:
    get:
      tags:
        - ESignatureTest
      operationId: refusals
      summary: How often the service refused to take a document
      description: |
        The service refuses every document of the signer 'Jane Errornous' with an error. A test reads here how often the application tried.
      parameters:
        - $ref: "#/components/parameters/ContractId"
      responses:
        "200":
          description: "The number of refused attempts, 0 if there were none"
          content:
            application/json:
              schema:
                type: integer
components:
  parameters:
    ContractId:
      name: contractId
      in: query
      required: true
      description: The id the caller gave the document
      schema:
        type: string
  schemas:
    SignatureStatus:
      type: string
      description: What a report of the e-signature service says
      enum:
        - SIGNED
        - DECLINED
    SentCallback:
      type: object
      description: One report the e-signature service sent to a callback address
      required:
        - contractId
        - status
      properties:
        contractId:
          type: string
          description: The id of the document the report is about
        status:
          $ref: "#/components/schemas/SignatureStatus"
        answer:
          type: integer
          description: The HTTP status the application answered with. Missing if the
            application did not answer.
