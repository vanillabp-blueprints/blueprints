openapi: 3.0.3
info:
  title: Loan approval
  description: |
    The API of the use case 'loan-approval'. A person walks through the process in a browser with its GET requests, without any tool and without a request body. The forms of the user tasks complete them with POST on the same paths. They send no body, because the user tasks take no input.
    The build generates Java code from this file twice. The module 'server' generates the interface 'LoanApprovalApi' and the classes of the schemas below, and 'ApiController' of the workflow module implements it. The module 'client' generates the client, which the process driver uses. So the paths, the parameters and the answers below are the contract, and nobody writes them by hand.
  version: 1.0.0
servers:
  - url: http://localhost:8080
tags:
  - name: loan-approval
    description: Operating the use case 'loan-approval'
paths:
  /loan-approval/api/request:
    get:
      tags:
        - loan-approval
      operationId: request
      summary: Requests a loan
      parameters:
        - name: customerId
          in: query
          description: The customer asking for the loan
          schema:
            type: string
            default: C-1001
        - name: customerName
          in: query
          description: |
            The name of the customer, who signs the contract. The simulator of the e-signature service acts on some names by itself, see the README.
          schema:
            type: string
            default: Jane Doe
        - name: amount
          in: query
          description: The amount requested
          schema:
            type: integer
            default: 5000
      responses:
        "200":
          description: Whether a workflow started for the loan request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Answer"
        "503":
          description: |
            The credit rating does not answer while the user waits for it. The answer names the role of the system which is missing.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Unavailable"
  /loan-approval/api/{loanRequestId}/assess-risk/{taskId}:
    get:
      tags:
        - loan-approval
      operationId: assessRisk
      summary: Completes the user task "Assess risk"
      parameters:
        - $ref: "#/components/parameters/LoanRequestId"
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: A confirmation
          content:
            text/plain:
              schema:
                type: string
    post:
      tags:
        - loan-approval
      operationId: completeAssessRisk
      summary: "Completes the user task \"Assess risk\", called by its form"
      parameters:
        - $ref: "#/components/parameters/LoanRequestId"
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: A confirmation
          content:
            text/plain:
              schema:
                type: string
  /loan-approval/api/{loanRequestId}/check-contract/{taskId}:
    get:
      tags:
        - loan-approval
      operationId: checkContract
      summary: "Completes the user task \"Check contract\", once the customer signed\
        \ the contract"
      parameters:
        - $ref: "#/components/parameters/LoanRequestId"
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: A confirmation
          content:
            text/plain:
              schema:
                type: string
        "409":
          description: |
            The customer has not signed the contract yet. The task stays open, and the user may try again later.
          content:
            text/plain:
              schema:
                type: string
    post:
      tags:
        - loan-approval
      operationId: completeCheckContract
      summary: |
        Completes the user task "Check contract", once the customer signed the contract, called by its form
      parameters:
        - $ref: "#/components/parameters/LoanRequestId"
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: A confirmation
          content:
            text/plain:
              schema:
                type: string
        "409":
          description: |
            The customer has not signed the contract yet. The task stays open, and the form says so.
          content:
            text/plain:
              schema:
                type: string
  /loan-approval/api/{loanRequestId}:
    get:
      tags:
        - loan-approval
      operationId: show
      summary: Shows what the process did
      description: |
        A person reads here how far a loan approval came, and which user task is open. The process driver reads the same to know when a step of the process is done.
      parameters:
        - $ref: "#/components/parameters/LoanRequestId"
      responses:
        "200":
          description: The loan request as it is stored right now
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoanRequest"
        "404":
          description: There is no loan request of this id
components:
  parameters:
    LoanRequestId:
      name: loanRequestId
      in: path
      required: true
      description: The id of the loan request
      schema:
        type: string
    TaskId:
      name: taskId
      in: path
      required: true
      description: "The id of the user task, as the log and the cockpit show it"
      schema:
        type: string
  schemas:
    Answer:
      type: object
      description: The answer to a loan request
      required:
        - loanRequestId
        - outcome
      properties:
        loanRequestId:
          type: string
          description: The id of the loan request
        outcome:
          type: string
          description: started or declined
    LoanRequest:
      type: object
      description: |
        A loan request and how far its process came. A field which is not there has not happened yet.
      required:
        - loanRequestId
        - customerId
        - customerName
        - amount
        - creditScore
        - riskAssessmentNeeded
      properties:
        loanRequestId:
          type: string
          description: The id of the loan request
        customerId:
          type: string
          description: The customer asking for the loan
        customerName:
          type: string
          description: "The name of the customer, who signs the contract"
        amount:
          type: integer
          description: The amount requested
        creditScore:
          type: integer
          description: The answer of the credit rating
        riskAssessmentNeeded:
          type: boolean
          description: Whether somebody has to assess the risk before the contract
            goes out
        assessRiskTaskId:
          type: string
          description: "The id of the user task \"Assess risk\", while it is open"
        riskAssessed:
          type: boolean
          description: Set when somebody assessed the risk
        contractSentForSigning:
          type: boolean
          description: Set when the e-signature service took the contract
        checkContractTaskId:
          type: string
          description: "The id of the user task \"Check contract\", while it is open"
        contractSigned:
          type: boolean
          description: Set when the e-signature service reported the signature
        contractChecked:
          type: boolean
          description: "Set when somebody checked the signed contract, which approves\
            \ the loan"
        contractDeclined:
          type: boolean
          description: Set when the e-signature service reported that the customer
            declined to sign
        loanDeclined:
          type: boolean
          description: |
            Set when the workflow took the user task "Check contract" away because the customer declined to sign. The loan is declined, and the workflow ended.
    Unavailable:
      type: object
      description: |
        The answer when a system around the module does not answer, in the fields of a problem detail (RFC 9457). It is a schema of its own and not the problem detail class of the platform, because how such a class is written as JSON depends on the Jackson version on the classpath, and an engine may bring another one.
      required:
        - status
        - title
        - detail
        - externalSystem
      properties:
        status:
          type: integer
          description: "The HTTP status, 503"
        title:
          type: string
          description: A short summary
        detail:
          type: string
          description: What the user can do
        externalSystem:
          type: string
          description: The role of the system which does not answer
