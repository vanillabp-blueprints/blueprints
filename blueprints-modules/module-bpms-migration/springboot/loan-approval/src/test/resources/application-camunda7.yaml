# Everything specific to Camunda 7, loaded only while the 'camunda7' profile applies. The
# Maven profile of the same name activates it for the test as well.
#
# This is the state before the migration: one adapter, and nothing to prioritize.
vanillabp:
  adapters:
    camunda7:
      # The same mode as in the application's profile file, so this test runs the
      # configuration the blueprint ships. Without this line the test would fall back to the
      # default 'by-adapter' and address Camunda 7 differently than the application does.
      name-clash-avoidance: use-prefix
      # How long a correlated message waits for the workflow to reach the event which
      # waits for it. Completing a task does not mean the engine is already there.
      message-time-to-live: 1m
