# Everything specific to Camunda 8, loaded only while the 'camunda8' profile applies. The
# Maven profile of the same name activates it for the test as well, and CI overrides the
# address through the environment.
#
# This is the migration state: both adapters are configured, Camunda 8 first, and the
# repayment workflow stays in Camunda 7.
vanillabp:
  prioritized-adapters:
    - camunda8
    - camunda7
  adapters:
    camunda8:
      # The identifiers of this workflow module are prefixed in the BPMS, which keeps modules
      # apart without a tenant, and a BPMS is licensed per tenant. BPMN files, business code and
      # configuration keep the plain names, the adapter translates at every boundary. Switching
      # the mode of a running application is a migration rather than a setting.
      name-clash-avoidance: use-prefix
      rest-address: http://localhost:8080
      # This adapter leases the jobs it holds from the activation to the answer. The cluster
      # then takes the answer of the current activation only, so a run whose lock ran out
      # while it was working cannot overwrite what the newer run wrote. The key has no
      # default, because a lease cannot be taken back. The adapter recommends this value, so
      # the blueprint shows it. On a cluster before 8.10 the key is read and does nothing, so
      # one configuration serves either line:
      # https://github.com/vanillabp/camunda8-adapter/wiki/Configuration#a-job-somebody-else-holds
      job-lease: use
    camunda7:
      # The mode of the OLD BPMS, spelled out for the same reason as in the application's
      # profile file: the default would be 'by-adapter', and then the migration state would
      # address Camunda 7 differently than the state before it.
      name-clash-avoidance: use-prefix
  workflow-modules:
    loan-approval:
      workflows:
        loan_repayment:
          prioritized-adapters:
            - camunda7
