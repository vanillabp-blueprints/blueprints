# The state DURING the migration: both BPMS configured at once. Loaded while the 'camunda8'
# profile applies, and that profile brings BOTH adapters along, because a migration always
# has the old BPMS still in it.
vanillabp:
  # The order is the whole configuration. New workflows start in the first adapter of this
  # list; every operation on a workflow which already exists is routed to the adapter
  # holding it, which VanillaBP finds by asking the adapters in this order.
  prioritized-adapters:
    - camunda8
    - camunda7
  adapters:
    camunda8:
      # Camunda 8 is a remote engine: point this at your cluster.
      rest-address: http://localhost:8080
      # Twenty seconds instead of the default of five minutes, and this blueprint is the one
      # which needs to say why. A workflow started right after the application restarted waits
      # for the lock of its first job: something took that job and never answered, and only the
      # redelivery after the lock expires reaches the worker which is open. Measured twice,
      # once per lock duration (GAPS.md G25). Five minutes would be five minutes of watching
      # nothing, so the demo and its test use a lock a handler of this size can live with.
      job-timeout: PT20S
    camunda7:
      webapps:
        admin-user:
          id: demo
          password: demo
          first-name: Demo
          last-name: User
  workflow-modules:
    loan-approval:
      workflows:
        # The workflow which stays behind: repayments keep starting in the old BPMS while
        # approvals already start in the new one. The list is the same key one level deeper,
        # and the most specific non-empty list wins - that is how a migration can be done
        # one workflow at a time instead of all at once.
        loan_repayment:
          prioritized-adapters:
            - camunda7
