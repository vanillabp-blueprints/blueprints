# The state DURING the migration: both BPMS configured at once. Applies while the 'camunda8'
# profile is the parent profile, and that Maven profile brings BOTH adapters along, because a
# migration always has the old BPMS still in it.
#
# The state BEFORE the migration needs no file of its own: with a single adapter there is
# nothing to prioritize and the embedded engine needs nothing but its dependency.
vanillabp:
  # The order is the whole configuration. New workflows start in the first adapter of this
  # list; every operation on a workflow which already exists is routed to the adapter
  # holding it, which VanillaBP finds by asking the adapters in this order.
  prioritized-adapters:
    - camunda8
    - camunda7
  adapters:
    camunda8:
      # The identifiers of this workflow module are prefixed in the BPMS, which keeps modules
      # apart without a tenant, and a BPMS is licensed per tenant. BPMN files, business code and
      # configuration keep the plain names, the adapter translates at every boundary. Switching
      # the mode of a running application is a migration rather than a setting.
      name-clash-avoidance: use-prefix
      # Camunda 8 is a remote engine: point this at your cluster.
      rest-address: http://localhost:8080
      # Twenty seconds instead of the default of five minutes, and this blueprint is the one
      # which needs to say why. The lock is how long a job stays reserved for a worker which
      # does not answer, so it is also how long anything waits which ends up behind such a
      # job. Five minutes of that would be five minutes of watching nothing, and the handlers
      # here finish in milliseconds. The adapter itself keeps a restart from producing that
      # case, by waiting for the cluster to release its workers before it closes the client:
      # https://github.com/vanillabp/camunda8-adapter/wiki/Configuration#what-a-restart-costs-the-application-which-starts-next
      job-timeout: PT20S
  workflow-modules:
    loan-approval:
      workflows:
        # The workflow which stays behind: repayments keep starting in the old BPMS while
        # approvals already start in the new one. The list is the same key one level deeper,
        # and the most specific non-empty list wins - that is how a migration can be done
        # one workflow at a time instead of all at once.
        loan_repayment:
          prioritized-adapters:
            - camunda7
