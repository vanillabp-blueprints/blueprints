# The state BEFORE the migration: one BPMS, configured as one adapter instance. Applies
# while the 'camunda7' profile is the parent profile, which the Maven profile of the same
# name sets.
#
# Nothing here says "first priority": with a single adapter there is nothing to prioritize.
# That is what makes the migration a configuration change rather than a rewrite - see
# 'application-camunda8.yaml', which is the state AFTER.
vanillabp:
  adapters:
    camunda7:
      # The identifiers of this workflow module are prefixed in the BPMS, which keeps modules
      # apart without a tenant, and a BPMS is licensed per tenant. BPMN files, business code and
      # configuration keep the plain names, the adapter translates at every boundary. Switching
      # the mode of a running application is a migration rather than a setting.
      name-clash-avoidance: use-prefix
