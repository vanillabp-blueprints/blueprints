# Everything specific to Camunda 8, applying while the 'camunda8' profile is the parent
# profile of the test. CI overrides the address through the environment.
#
# This is the migration state: both adapters are configured, Camunda 8 first, and the
# repayment workflow stays in Camunda 7.
vanillabp:
  prioritized-adapters:
    - camunda8
    - camunda7
  adapters:
    camunda8:
      rest-address: http://localhost:8080
  workflow-modules:
    loan-approval:
      workflows:
        loan_repayment:
          prioritized-adapters:
            - camunda7
