# Everything specific to CIB seven, applying while the 'cibseven' profile is the parent
# profile of the test.
#
# This is the state during a migration from Camunda 7 to CIB seven: both adapters are
# configured, CIB seven first, and the repayment workflow stays in Camunda 7. CIB seven runs on a
# database of its own, because two engines must not share one set of tables.
quarkus:
  datasource:
    cibseven:
      db-kind: h2
      username: sa
      jdbc:
        # One transaction writes to both databases: the aggregate goes to the application's,
        # the state of CIB seven's engine to this one. The transaction manager takes one
        # datasource without two-phase commit in a transaction, not two, so this one takes part
        # in the two-phase commit (XA).
        transactions: xa
        url: jdbc:h2:mem:migration-test-cibseven;DB_CLOSE_DELAY=-1
vanillabp:
  prioritized-adapters:
    - cibseven
    - camunda7
  adapters:
    cibseven:
      # The identifiers of this workflow module are prefixed in the BPMS, which keeps modules
      # apart without a tenant, and a BPMS is licensed per tenant. BPMN files, business code and
      # configuration keep the plain names, the adapter translates at every boundary. Switching
      # the mode of a running application is a migration rather than a setting.
      name-clash-avoidance: use-prefix
      # How long a correlated message waits for the workflow to reach the event which
      # waits for it. Completing a task does not mean the engine is already there.
      message-time-to-live: 1m
      data-source-name: cibseven
    camunda7:
      # The mode of the OLD BPMS, spelled out for the same reason as in the application's
      # profile file: the default would be 'by-adapter', and then the migration state would
      # address Camunda 7 differently than the state before it.
      name-clash-avoidance: use-prefix
      message-time-to-live: 1m
      # With a second datasource in the application, every embedded engine names its own.
      # 'default' is the application's datasource, where Camunda 7 had its tables before.
      data-source-name: default
  workflow-modules:
    loan-approval:
      workflows:
        loan_repayment:
          prioritized-adapters:
            - camunda7
