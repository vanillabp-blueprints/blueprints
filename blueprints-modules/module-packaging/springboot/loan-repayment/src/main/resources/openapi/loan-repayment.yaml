openapi: 3.0.3
info:
  title: Loan repayment
  description: >
    The API of the use case 'loan-repayment'. It has GET requests only, so a person can walk through
    the process in a browser, without any tool and without a request body.

    The build generates the Java interface 'LoanRepaymentApi' from this file, and 'ApiController'
    implements it. So the paths, the parameters and the answers below are the contract, and nobody
    writes them by hand.
  version: 1.0.0
servers:
  - url: http://localhost:8080
tags:
  - name: loan-repayment
    description: Operating the use case 'loan-repayment'
paths:
  /api/loan-repayment/start:
    get:
      tags:
        - loan-repayment
      operationId: start
      summary: Starts a repayment
      parameters:
        - name: customerId
          in: query
          description: The customer paying back
          schema:
            type: string
            default: C-1002
        - name: amount
          in: query
          description: The amount owed
          schema:
            type: integer
            default: 6000
      responses:
        '200':
          description: The id of the repayment started
          content:
            text/plain:
              schema:
                type: string
  /api/loan-repayment/{repaymentId}:
    get:
      tags:
        - loan-repayment
      operationId: show
      summary: Shows what the process did
      parameters:
        - name: repaymentId
          in: path
          required: true
          description: The id returned by starting the process
          schema:
            type: string
      responses:
        '200':
          description: The workflow aggregate as it is stored right now
          content:
            text/plain:
              schema:
                type: string
