# Everything specific to Camunda 8, loaded only while the 'camunda8' profile is active. The
# Maven profile of the same name activates it, so the BPMS is chosen once.
vanillabp:
  adapters:
    camunda8:
      # Camunda 8 is a remote engine: point this at your cluster.
      rest-address: http://localhost:8080
      # The same reason as on the other engine: two workflow modules, one BPMS, and nothing
      # but this setting keeping their identifiers apart. Prefixing needs no tenant, which
      # matters on a BPMS licensed per tenant - see the README.
      name-clash-avoidance: use-prefix
