# The users of the cockpit in 'docker-compose.yaml'. The cockpit asks the dev shell simulator
# for them when it starts, and the simulator refuses to start without any. Log in to the
# cockpit as one of them, with the password 'test'. The workflow module names the access group
# LOAN_APPROVAL_USERS, and its group hierarchy makes LOAN_OFFICERS stand for it. Jane is a loan
# officer, so the cockpit lists the workflow module for her, and a cockpit user interface shows
# her the button "Request a loan". Mary is in the access group only: the cockpit lists the
# module for her, but the user interface shows her no button. John is in neither group, so the
# cockpit leaves the module out of his list.
dev-shell-simulator:
  users:
    - id: jane
      email: jane@doe.com
      first-name: Jane
      last-name: Doe
      groups: LOAN_OFFICERS
    - id: mary
      email: mary@doe.com
      first-name: Mary
      last-name: Doe
      groups: LOAN_APPROVAL_USERS
    - id: john
      email: john@doe.com
      first-name: John
      last-name: Doe
      groups: CUSTOMER_SERVICE
