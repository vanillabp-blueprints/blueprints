# Serves the micro-frontends below /loan-approval/ and nothing else.
server {
  listen 80;
  root /usr/share/nginx/html;

  # The manifest has a fixed name, so it must never be cached. Otherwise a browser keeps
  # loading the files of an old build.
  location ~ ^/[^/]+/bc-manifest\.json$ {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # Every other file has the hash of its content in its name. A new build gives new names, so
  # these files may be cached for good.
  location ~ ^/[^/]+/(entries|chunks)/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    return 404;
  }
}
