# A local npm registry for the packages of the module kit, until they are on npmjs.com. Every
# other package is fetched from npmjs.com through it. Anybody may publish, so keep it on your own
# machine or in a CI job. See the README, section "Running it".
storage: /verdaccio/storage/data
uplinks:
  npmjs:
    url: https://registry.npmjs.org/
packages:
  '@vanillabp/bc-*':
    access: $all
    publish: $all
    unpublish: $all
  '**':
    access: $all
    publish: $all
    proxy: npmjs
log: { type: stdout, format: pretty, level: warn }
