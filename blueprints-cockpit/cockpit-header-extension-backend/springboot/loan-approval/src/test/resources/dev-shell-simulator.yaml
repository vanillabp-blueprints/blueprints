# The users the dev shell simulator knows. It refuses to start without any. A dev shell lets
# you switch between them, to see the cockpit as somebody of another group sees it. Jane is a
# loan officer. The group hierarchy of the module gives her the access group as well, so she
# sees the module and the button "Request a loan" in the header. Mary is in the access group
# only: she sees the module, but the button is not for her. John is in neither group, so the
# cockpit does not list the workflow module for him, and he sees no button.
dev-shell-simulator:
  users:
    - id: jane
      email: jane@doe.com
      first-name: Jane
      last-name: Doe
      groups: LOAN_OFFICERS
    - id: mary
      email: mary@doe.com
      first-name: Mary
      last-name: Doe
      groups: LOAN_APPROVAL_USERS
    - id: john
      email: john@doe.com
      first-name: John
      last-name: Doe
      groups: CUSTOMER_SERVICE
