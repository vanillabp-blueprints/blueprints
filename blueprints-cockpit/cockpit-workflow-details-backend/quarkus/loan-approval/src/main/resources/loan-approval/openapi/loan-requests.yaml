openapi: 3.0.3
info:
  title: Loan requests
  description: >
    The API of the use case 'loan-requests'. It has GET requests only, so a person can walk through
    the process in a browser, without any tool and without a request body.

    The build generates the Java interface 'LoanRequestsApi' from this file, and 'ApiController'
    implements it. So the paths, the parameters and the answers below are the contract, and nobody
    writes them by hand.

    The server names the workflow module, so the paths below start with /api. 'ApiController'
    puts /loan-approval in front of the paths of the interface, which gives the URLs of the
    server plus the path.
  version: 1.0.0
servers:
  - url: http://localhost:8080/loan-approval
tags:
  - name: loan-requests
    description: Operating the use case 'loan-requests'
paths:
  /api/loan-requests/start:
    get:
      tags:
        - loan-requests
      operationId: start
      summary: Starts a loan approval
      parameters:
        - name: applicant
          in: query
          description: Who asks for the loan
          schema:
            type: string
            default: Jane Doe
        - name: amount
          in: query
          description: The amount requested
          schema:
            type: integer
            default: 5000
      responses:
        '200':
          description: The id of the loan request started
          content:
            text/plain:
              schema:
                type: string
  /api/loan-requests/{loanRequestId}/approve:
    get:
      tags:
        - loan-requests
      operationId: approve
      summary: Approves the loan request, which completes the user task
      parameters:
        - name: loanRequestId
          in: path
          required: true
          description: The id returned by starting the process
          schema:
            type: string
      responses:
        '200':
          description: What happened
          content:
            text/plain:
              schema:
                type: string
  /api/loan-requests/{loanRequestId}:
    get:
      tags:
        - loan-requests
      operationId: show
      summary: Shows what the process did
      parameters:
        - name: loanRequestId
          in: path
          required: true
          description: The id returned by starting the process
          schema:
            type: string
      responses:
        '200':
          description: The workflow aggregate as it is stored right now
          content:
            text/plain:
              schema:
                type: string
