# Configuration of the workflow module 'loan-approval'.
#
# The file is named after the workflow module ID and is loaded automatically, with a
# lower priority than application.yaml. Everything only this module needs belongs here -
# that is what keeps a workflow module a self-contained application inside the
# application.
loan-approval:
  rating-scale: 100
  # The documents somebody checks for every loan request. The workflow opens one user task
  # "Check document" per entry, all of them at the same time.
  required-documents:
    - id-card
    - income-statement

# The list the model loops over reaches the BPMS, and a list is neither a boolean nor a
# text, so it is declared. A multi-instance task needs the collection itself: it counts the
# entries to know how often it runs, and no boolean getter can answer that.
vanillabp:
  workflow-modules:
    loan-approval:
      workflows:
        loan_approval:
          declared-aggregate-values:
            - documentIds
          # The parallel gateway and the multi-instance task put more than one token into the
          # process, and the aggregate has no version attribute. So VanillaBP warns at startup
          # that two branches may overwrite each other. Here they do not: a task and a document
          # check are rows of their own tables, and @DynamicUpdate makes the result of the risk
          # assessment write only its own columns. VanillaBP cannot see that in the code, so the
          # review is stated here, and the warning stays silent. Whoever changes the model checks
          # again whether this line still holds.
          concurrent-branches-reviewed: true
