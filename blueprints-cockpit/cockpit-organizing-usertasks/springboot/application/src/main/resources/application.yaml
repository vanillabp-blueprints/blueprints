# Only what is truly cross-cutting belongs here. Everything the workflow module needs is
# in its own configuration file (loan-approval/loan-approval.yaml inside the module JAR).
#
# Nothing about a BPMS is here either. That lives in a profile file per engine,
# 'application-camunda7.yaml' and 'application-camunda8.yaml', so switching engines is a
# profile and not an edit. One adapter dependency and one workflow module are enough for
# VanillaBP to derive the adapter, the workflow module and where its BPMN files are read
# from.
spring:
  # The BPMS is chosen by the Maven profile, and this is where that choice reaches the
  # application: the build replaces the placeholder with the profile's name, so
  # 'application-camunda7.yaml' respectively 'application-camunda8.yaml' is loaded without
  # anybody having to name the profile twice. Tests get the same value as a system property.
  profiles:
    active: "@bpms@"
  datasource:
    url: jdbc:h2:mem:loan-approval;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    # No database session stays open while a response is written. The tasks of a loan
    # approval and their data are loaded only when read, so every read has to happen inside
    # a transaction of the service. This setting makes a read outside of one fail at once,
    # instead of working by chance in a web request and failing anywhere else.
    open-in-view: false
vanillabp:
  # Where the reports about workflows and user tasks go. Which cockpit an application reports
  # to is a matter of the application, not of the workflow module. This is the dev shell
  # simulator of the cockpit on its default port, see the README. Every report goes through
  # the outbox first, so a cockpit which is not running loses nothing. The reports wait until
  # it is there.
  # https://github.com/vanillabp/business-cockpit/wiki/Connecting-a-workflow-module#rest-kafka-or-a-way-of-your-own
  cockpit:
    rest:
      base-url: http://localhost:8079
logging:
  level:
    blueprint.workflowmodule: INFO
