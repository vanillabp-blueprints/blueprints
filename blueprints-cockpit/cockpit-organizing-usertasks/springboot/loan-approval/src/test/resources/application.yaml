spring:
  datasource:
    url: jdbc:h2:mem:loan-approval-test;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    # No database session stays open while a response is written. The tasks of a loan
    # approval and their data are loaded only when read, so every read has to happen inside
    # a transaction of the service. This setting makes a read outside of one fail at once,
    # instead of working by chance in a web request and failing anywhere else.
    open-in-view: false
vanillabp:
  # Every report to the cockpit goes through the outbox first. A short poll interval lets the
  # test see the reports a moment after they were written. An application keeps the default.
  outbox:
    poll-interval: PT0.2S
  cockpit:
    # Where the reports go. The integration test starts the dev shell simulator on a free port,
    # puts a recorder in front of it and sets this address to the recorder.
    rest:
      base-url: http://localhost:8079
logging:
  level:
    blueprint.workflowmodule: INFO
