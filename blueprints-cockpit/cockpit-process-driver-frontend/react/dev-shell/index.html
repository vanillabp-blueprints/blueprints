<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dev shell of loan-approval</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; color: #1d2733; background: #f4f6f8; }
    header { display: flex; align-items: center; gap: 1.5rem; padding: 0.75rem 1.5rem; background: #1d2733; color: #fff; }
    header a { color: #fff; }
    main { max-width: 56rem; margin: 1.5rem auto; padding: 1.5rem; background: #fff; border-radius: 0.5rem; }
    label { display: flex; flex-direction: column; gap: 0.25rem; margin-bottom: 0.75rem; font-weight: 600; }
    input, select { font: inherit; padding: 0.375rem; max-width: 24rem; }
    button { font: inherit; padding: 0.5rem 1.25rem; border: 0; border-radius: 0.25rem; background: #2f6fbd; color: #fff; cursor: pointer; }
    button:disabled { background: #b6c0ca; cursor: default; }
    .problem { color: #b3261e; white-space: pre-wrap; overflow-wrap: anywhere; }
    .hint { color: #4b5563; }
    [data-bc-area] { margin-bottom: 1rem; }
  </style>
  <script type="module" src="./main.js"></script>
</head>
<body>
  <header>
    <strong>Dev shell of loan-approval</strong>
    <a href="#/process-driver">Process driver</a>
  </header>
  <main id="dev-shell"></main>
</body>
</html>
