# The configuration of the module's own test: its database, how fast the cockpit hears about a
# user task, and where the reports go. Where the BPMN files are is a convention VanillaBP knows.
quarkus:
  # A free port for the application under test, so it runs next to anything else on 8081.
  http:
    test-port: 0
  datasource:
    db-kind: h2
    username: sa
    jdbc:
      url: jdbc:h2:mem:loan-approval-test;DB_CLOSE_DELAY=-1
  hibernate-orm:
    schema-management:
      strategy: drop-and-create
  log:
    category:
      "blueprint.workflowmodule":
        level: INFO
vanillabp:
  # Every report to the cockpit goes through the outbox first. A short poll interval lets the
  # test see the reports a moment after they were written. An application keeps the default.
  outbox:
    poll-interval: PT0.2S
  cockpit:
    # Where the reports go: the dev shell simulator, on the port it uses by default. That is
    # the setup for developing the user interface against this backend. The integration test
    # starts a simulator of its own on a free port and overrides this address.
    rest:
      base-url: http://localhost:8079
# The official GUI API of the cockpit, which the module asks who took over a user task. The dev
# shell simulator on its default port serves the user tasks below this path. It does not know who
# is logged in, so a form is never refused there. The integration test sets the address of a
# stand-in which knows both answers.
loan-approval:
  cockpit:
    base-url: http://localhost:8079/official-api/v1
# The module reads no login token of the Business Cockpit. It only hands the cookie on, and the
# cockpit checks it. The support library of the cockpit checks such a token unless it is told
# not to, and then the start asks for the secret of the cockpit. So the test leaves the check
# out. It is a build property: Quarkus reads it while it builds the application. An application
# which runs this module and reads no token says the same.
business-cockpit:
  jwt:
    enabled: false
